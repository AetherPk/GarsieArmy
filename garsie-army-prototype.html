<!DOCTYPE html>
<!--
===============================================================================
  GARSIE ARMY — supporter app for Hoërskool Garsfontein
  Clickable prototype / handoff spec  ·  v1.0  ·  2026-09-21
===============================================================================

  WHAT THIS IS
  A single-file, dependency-free prototype of the supporter app. It exists to
  pin down the screens, the flows and the data model. It is NOT production
  code — there is no backend, no auth and no build step. Open it in a browser
  (desktop or phone) and click through it.

  THE IDEA
  Every school event — sport and cultural — in one calendar, with a link out
  to the ticket page. Ticketing, capacity and gate scanning stay on Quicket;
  this app is the supporter-facing front end on top of it.

  SIGN IN
  Before the tabs, an Aanmeld screen: Registreer (e-pos, naam, van, graad)
  or Teken in (e-pos), then a one-time code. Built for Supabase magic OTP
  but not connected yet — it accepts anything. Search "screenAuth".

  ROLES (picked on the sign-in screen in this prototype)
    Gebruiker          supporter: the four tabs below
    Departement-admin  + "Skep" tab: create / edit / export events of ONE department
    Hoof-admin         + "Bestuur" tab: departments and who is admin of what,
                       and can create / edit / export events of ANY department
  Admin tabs sit in front of the normal four. Search "ROLES & PERMISSIONS".
  TODO: in production the role comes from the admins table (managed in
  Bestuur), never from a picker the user controls.

  THE FOUR TABS
    Kalender  Week view. Days run top to bottom, hours left to right
              (scroll horizontally). Tap a block to open the event.
    Kaart     Map of the school + "Meld aan" check-in, and a QR mode for
              gate check-in at free events.
    Soek      Search and filter by department.
    Myne      Events the user has tapped "Ek ondersteun" on.

  WHAT IS REAL vs FAKE IN THIS FILE
    Real   layout, navigation, week maths, search, filtering, support toggle
    Fake   EVENTS is hard-coded (see DATA below)
           the map is a hand-drawn SVG, not a real map SDK
           "Meld aan" and the QR screen are visual only
           ticket links point at quicket.co.za, not real event pages

  BUILD NOTES FOR THE DEVELOPER
  Search this file for "TODO:" — each one marks an integration point.
  Summary of what has to be built for real:
    1. Events API (shape documented at the EVENTS array below).
    2. An admin screen where a coach/organiser submits an event and a staff
       member approves it. This is the part that decides whether the app
       lives or dies — a calendar with stale fixtures gets abandoned.
    3. Auth + per-user "Ek ondersteun" list, persisted server-side.
    4. Push notifications for changes (a rained-out fixture is the main case).
    5. POPIA: if learner names/grades are stored, that is personal data of
       minors. Get the school's sign-off on what is collected and retained
       BEFORE writing that table.

  SUGGESTED STACK (not prescriptive)
  React Native or Flutter if it must be in the app stores; a PWA is cheaper
  and installs to the home screen, which is enough for most school use.
  Whatever is chosen, keep events in one source of truth so the school's
  website and this app cannot disagree.

  LANGUAGE
  All UI copy is Afrikaans. Code comments are English. If the app ships
  bilingual, pull the strings into a locale file rather than hard-coding —
  see the STRINGS note further down.

  BRANDING
  --brand (#C0262D) is a placeholder red. Replace with the school's official
  colours and add the crest before this is shown to anyone at the school.
===============================================================================
-->

<script>
"use strict";

/* ===========================================================================
   1. CONFIG
   Everything a developer would want to change first lives here.
=========================================================================== */
const CONFIG = {
  school: "Hoërskool Garsfontein",

  // Visible hour range in the week view and the column width per hour.
  // 06:00–22:00 covers early practices through evening concerts.
  dayStartHour: 6,
  dayEndHour:   22,
  hourWidthPx:  56,
  rowHeightPx:  54,

  // Where the horizontal scroll lands when the calendar opens.
  // Most school events are afternoon, so don't start the user at 06:00.
  initialScrollHour: 13,

  // The prototype pins "today" so the red now-line and the demo week line up.
  // TODO: in production this is simply new Date().
  demoToday: "2026-06-16T16:34:00"
};

/* ===========================================================================
   2. DATA
   ---------------------------------------------------------------------------
   This array stands in for:  GET /api/events?from=YYYY-MM-DD&to=YYYY-MM-DD

   Event shape (keep these field names — the UI reads them directly):
     id           number|string   stable unique id
     title        string          shown on the block and the detail screen
     department   string          id of an entry in DEPARTMENTS
     date         "YYYY-MM-DD"    local date, no timezone games
     start,end    "HH:MM"         24h local time
     venue        string          free text, shown as "Plek"
     description  string          one or two sentences for supporters
     ticketUrl    string|null     null hides the "Koop kaartjies" button

   Fields the real API will also need, not used by this prototype:
     status       "scheduled" | "moved" | "cancelled"   (rain is constant)
     team         e.g. "o/16 A"    so supporters can follow one team
     updatedAt    timestamp        for sync and "changed" badges
     isHome       boolean          away fixtures need travel info instead
=========================================================================== */
const SEED_EVENTS = [
  { id:1,  title:"Rugby: Garsies teen Menlopark",   department:"sport",   date:"2026-06-15", start:"15:00", end:"16:30", venue:"Hoofveld",        description:"Eerste span se groot derby. Trek jou Garsie-rooi aan.", ticketUrl:"https://www.quicket.co.za/" },
  { id:2,  title:"Debat",                           department:"kultuur", date:"2026-06-16", start:"14:00", end:"16:00", venue:"Kultuursentrum",  description:"Kom kyk die beste in die land.",                        ticketUrl:"https://www.quicket.co.za/" },
  { id:3,  title:"Netbal: o/16",                    department:"sport",   date:"2026-06-16", start:"16:30", end:"17:30", venue:"Netbalbane",      description:"Kom ondersteun ons o/16-meisies.",                      ticketUrl:null },
  { id:4,  title:"Oggend-byeenkoms",                department:"kultuur", date:"2026-06-17", start:"07:30", end:"08:30", venue:"Saal",            description:"Spesiale byeenkoms vir die wintertoer.",                ticketUrl:null },
  { id:5,  title:"Koor-konsert",                    department:"kultuur", date:"2026-06-18", start:"18:30", end:"20:00", venue:"Saal",            description:"Die koor se wintertoer-voorskou.",                      ticketUrl:"https://www.quicket.co.za/" },
  { id:6,  title:"Atletiek-oefenbyeenkoms",         department:"sport",   date:"2026-06-19", start:"15:00", end:"17:00", venue:"Atletiekbaan",    description:"Kom moedig die atlete aan.",                            ticketUrl:null },
  { id:7,  title:"Hokkie: Garsies teen Waterkloof", department:"sport",   date:"2026-06-20", start:"09:00", end:"12:00", venue:"Kunsgrasveld",    description:"Toernooidag met drie wedstryde.",                       ticketUrl:"https://www.quicket.co.za/" },
  { id:8,  title:"Rugby o/15",                      department:"sport",   date:"2026-06-20", start:"13:00", end:"14:30", venue:"Hoofveld",        description:"Die o/15's speel tuis.",                                ticketUrl:null },
  { id:9,  title:"Kultuuraand",                     department:"kultuur", date:"2026-06-23", start:"19:00", end:"21:00", venue:"Kultuursentrum",  description:"Drama, musiek en redenaars op een verhoog.",            ticketUrl:"https://www.quicket.co.za/" },
  { id:10, title:"Tennis: eerste span",             department:"sport",   date:"2026-06-10", start:"14:00", end:"15:30", venue:"Tennisbane",      description:"Liga-wedstryd teen Menlopark.",                         ticketUrl:null },
  { id:11, title:"Sokker o/19",                     department:"sport",   date:"2026-06-25", start:"15:00", end:"17:00", venue:"B-veld",          description:"Halfeindronde van die liga.",                           ticketUrl:"https://www.quicket.co.za/" }
];

/* ---------------------------------------------------------------------------
   DEPARTMENTS
   Stand-in for GET /api/departments. Each department is just a name and a
   colour; every event belongs to exactly one. Hoof-admins create them in
   Bestuur, and every department gets a filter chip in Kalender, Soek and Myne.
     id       string   stable, never shown
     name     string   shown on chips, badges and the export
     colour   "#rrggbb"  the block/badge colour; light + dark tints are derived
--------------------------------------------------------------------------- */
const SEED_DEPARTMENTS = [
  { id:"sport",   name:"Sport",   colour:"#C0262D" },
  { id:"kultuur", name:"Kultuur", colour:"#5856d6" }
];

/* ---------------------------------------------------------------------------
   ADMINS
   Stand-in for the admins table: who may edit what. Managed in Bestuur.
     email       string
     role        "key" (Hoof-admin, everything) | "dept" (Departement-admin)
     department  department id — only for role "dept"
--------------------------------------------------------------------------- */
const SEED_ADMINS = [
  { email:"hoof@garsies.co.za",   role:"key",  department:null },
  { email:"rugby@garsies.co.za",  role:"dept", department:"sport" },
  { email:"koor@garsies.co.za",   role:"dept", department:"kultuur" }
];

// PROTOTYPE: departments, events and admins live in this browser so that
// what you create survives a refresh. Nobody else sees it — that needs the
// real backend (TODO: Supabase tables departments / events / admins).
let DEPARTMENTS = loadJSON("garsie.departments") || SEED_DEPARTMENTS;
let EVENTS      = loadJSON("garsie.events")      || SEED_EVENTS;
let ADMINS      = loadJSON("garsie.admins")      || SEED_ADMINS;
function persistData(){
  saveJSON("garsie.departments", DEPARTMENTS);
  saveJSON("garsie.events", EVENTS);
  saveJSON("garsie.admins", ADMINS);
}
function resetData(){
  DEPARTMENTS = SEED_DEPARTMENTS; EVENTS = SEED_EVENTS; ADMINS = SEED_ADMINS;
  ["garsie.departments","garsie.events","garsie.admins"].forEach(k => saveJSON(k, null));
}

/* ---------------------------------------------------------------------------
   ATTENDEES ("Ek ondersteun")
   Stand-in for GET /api/events/:id/attendees. The sample events get a
   deterministic list of FAKE people so the Excel export has something in it;
   new events start empty. The signed-in user is added when they tap
   "Ek ondersteun".
--------------------------------------------------------------------------- */
const SAMPLE_FIRST = ["Anika","Ruan","Liezl","Jaco","Marli","Pieter","Chané","Wian","Elna","Dewald","Carla","Juan","Mia","Stefan","Zelda","Hendrik"];
const SAMPLE_LAST  = ["van der Merwe","Botha","Pretorius","Nel","du Plessis","Venter","Kruger","Steyn","Coetzee","Smit","Fourie","Joubert"];
const SEED_EVENT_IDS = new Set(SEED_EVENTS.map(e => e.id));

function attendeesOf(e){
  const people = [];
  if (SEED_EVENT_IDS.has(e.id)){
    const n = 4 + (e.id * 7) % 15;
    for (let i = 0; i < n; i++){
      const name    = SAMPLE_FIRST[(i * 3 + e.id) % SAMPLE_FIRST.length];
      const surname = SAMPLE_LAST[(i * 5 + e.id * 2) % SAMPLE_LAST.length];
      const slug    = `${name}.${surname}`.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, "").toLowerCase();
      people.push({ name, surname, grade: GRADES[(i + e.id) % GRADES.length], email: `${slug}${i}@voorbeeld.co.za` });
    }
  }
  if (state.user && state.supported.has(e.id)){
    const { name = "", surname = "", grade = "", email = "" } = state.user;
    people.push({ name, surname, grade, email });
  }
  return people;
}

   app, lift every user-facing string into a locale file (af.json / en.json)

   school needs both languages eventually.
--------------------------------------------------------------------------- */
const MONTHS = ["Januarie","Februarie","Maart","April","Mei","Junie",
                "Julie","Augustus","September","Oktober","November","Desember"];
const DAY_SHORT = ["Ma","Di","Wo","Do","Vr","Sa","So"];   // Monday-first

/* ===========================================================================

   Inline SVG paths so the file has zero network dependencies. In the real app

=========================================================================== */
const ICON_PATHS = {
  calendar:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M16 3v4M8 3v4M4 11h16"/>',
  pin:'<circle cx="12" cy="11" r="3"/><path d="M17.66 16.66 13.41 20.9a2 2 0 0 1-2.83 0l-4.24-4.24a8 8 0 1 1 11.31 0z"/>',
  search:'<circle cx="10" cy="10" r="7"/><path d="m21 21-6-6"/>',
  heart:'<path d="M19.5 12.57 12 20l-7.5-7.43A5 5 0 1 1 12 6.01a5 5 0 1 1 7.5 6.57"/>',

  right:'<path d="m9 6 6 6-6 6"/>',

  locate:'<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2"/>',

function icon(name, size = 20, colour = "currentColor"){
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none"
    stroke="${colour}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
    aria-hidden="true" style="flex:none;vertical-align:middle">${ICON_PATHS[name]}</svg>`;
}

/* ===========================================================================
   4. DATE + TIME HELPERS
   Deliberately plain: no date library, local time only. If the real app ever
   handles away fixtures in another timezone, swap these for a library.
=========================================================================== */
const TODAY = new Date(CONFIG.demoToday);

function toDate(iso){                       // "2026-06-16" -> Date (local midnight)
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function toISO(date){                       // Date -> "2026-06-16"
  const p = n => String(n).padStart(2,"0");
  return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}`;
}
function addDays(date, n){
  const d = new Date(date); d.setDate(d.getDate() + n); return d;
}
function mondayOf(date){                    // week starts Monday (SA convention)
  const d = new Date(date);
  const shift = (d.getDay() + 6) % 7;       // Sun=0 -> 6, Mon=1 -> 0
  return addDays(d, -shift);
}
function hmToDecimal(hm){                   // "14:30" -> 14.5
  const [h,m] = hm.split(":").map(Number);
  return h + m / 60;
}
function sameDay(a, b){ return toISO(a) === toISO(b); }

// Events on a given day, earliest first.
function eventsOn(date){
  const iso = toISO(date);
  return EVENTS.filter(e => e.date === iso && passesFilter(e))
               .sort((a,b) => hmToDecimal(a.start) - hmToDecimal(b.start));
}
function eventById(id){ return EVENTS.find(e => e.id === id); }

// Department of an event, with the tints the UI needs derived from its one colour.
function deptById(id){
  const d = DEPARTMENTS.find(d => d.id === id) || { id, name:"Onbekend", colour:"#8e8e93" };
  return { ...d,
    wash: `color-mix(in srgb, ${d.colour} 14%, white)`,   // block / badge fill
    ink:  `color-mix(in srgb, ${d.colour} 72%, black)`,   // text on the wash
    deep: `color-mix(in srgb, ${d.colour} 70%, black)` }; // Myne card background
}
function deptOf(e){ return deptById(e.department); }

// Shared department filter (state.filter is "Alles" or a department id).
function passesFilter(e){ return state.filter === "Alles" || e.department === state.filter; }

/* ---------------------------------------------------------------------------
   ROLES & PERMISSIONS
   Every admin check in the UI goes through these two functions.
   TODO: enforce the same rules server-side (Supabase row-level security) —
   hiding a button is not security.
--------------------------------------------------------------------------- */
const ROLE_LABELS = { user:"Gebruiker", dept:"Departement-admin", key:"Hoof-admin" };
function roleOf(){ return (state.user && state.user.role) || "user"; }
function canAdmin(e){
  if (roleOf() === "key") return true;
  return roleOf() === "dept" && e.department === state.user.department;
}
// Departments this user may create events in.
function adminDepartments(){
  if (roleOf() === "key") return DEPARTMENTS;
  if (roleOf() === "dept") return DEPARTMENTS.filter(d => d.id === state.user.department);
  return [];
}

/* ===========================================================================
   5. STATE
   One plain object; every change calls render(). Fine for a prototype —
   replace with the framework's own state layer in the real build.
=========================================================================== */
// Prototype-only persistence so a refresh doesn't sign you out.
// TODO: Supabase keeps the session itself — drop these helpers then.
function loadJSON(key){
  try { return JSON.parse(localStorage.getItem(key)); } catch { return null; }
}
function saveJSON(key, value){
  try { value == null ? localStorage.removeItem(key) : localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const state = {

  user: loadJSON("garsie.user"),
  auth: { mode: "signup", step: "details", draft: {} },   // mode: signup | signin, step: details | code

  tab: "calendar",                  // calendar | map | search | mine
  openEventId: null,                // null = tab view, otherwise detail screen
  weekStart: mondayOf(TODAY),       // Monday of the visible week

  // TODO: persist per user, server-side. localStorage is not good enough —
  // supporters change phones and the school wants attendance numbers.
  supported: new Set([1]),

  query: "",
  filter: "Alles",
  mapMode: "map",                   // map | qr

  editingId: null,                  // Skep tab: id of the event being edited, null = new

/* --- 6a. Kalender -------------------------------------------------------
   The core screen. Days stack downwards, hours run left to right, so a whole
   week is one horizontally scrollable grid — a zoomed-in day view turned on
   its side. Blocks are positioned absolutely from start/end times.
------------------------------------------------------------------------- */
// Hour column width. Never narrower than CONFIG.hourWidthPx (phones scroll
// sideways), but on wide screens it grows so the whole day fits without scrolling.
function hourWidth(){
  const { dayStartHour:H0, dayEndHour:H1, hourWidthPx:MIN } = CONFIG;
  return Math.max(MIN, Math.floor((screenEl.clientWidth - 48) / (H1 - H0)));
}

// Department filter chips, shared by Kalender, Soek and Myne so the choice
// carries across tabs. New departments show up here automatically.
function filterChips(onDark = false){
  const chip = (value, label, colour) => {
    const active = state.filter === value;
    const style = active ? `background:${colour};border-color:${colour}` : "";
    return `<button class="chip ${onDark ? "on-dark" : ""} ${active ? "is-active" : ""}" data-filter="${esc(value)}" style="${style}">
      ${value === "Alles" ? "" : `<span class="dot" style="background:${active ? "#fff" : colour}"></span>`}${esc(label)}</button>`;
  };
  return `<div class="chips">${chip("Alles", "Alles", "var(--brand)")}${DEPARTMENTS.map(d => chip(d.id, d.name, d.colour)).join("")}</div>`;
}

function screenCalendar(){
  const { dayStartHour:H0, dayEndHour:H1, rowHeightPx:RH } = CONFIG;
  const PX = hourWidth();
  const gridWidth = (H1 - H0) * PX;
  const weekEnd   = addDays(state.weekStart, 6);
  const monthName = MONTHS[state.weekStart.getMonth()];

  let html = `
  <div style="padding:6px 16px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;color:var(--brand);font-size:15px">
      <span style="display:flex;align-items:center">${icon("left",20,"var(--brand)")}${monthName}</span>
      <span style="display:flex;gap:6px">
        <button data-tab="search" aria-label="Soek" style="background:none;border:none;padding:4px">${icon("search",20,"var(--brand)")}</button>
        ${roleOf() !== "user" ? `<button data-action="new-event" aria-label="Skep geleentheid" style="background:none;border:none;padding:4px">${icon("plus",20,"var(--brand)")}</button>` : ""}
      </span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin:4px 0 0">
      <div style="font-size:26px;font-weight:700">${state.weekStart.getDate()} – ${weekEnd.getDate()} ${monthName.slice(0,3)}</div>
      <div style="display:flex;gap:4px">
        <button data-action="week-prev" aria-label="Vorige week" style="width:30px;height:30px;border-radius:15px;border:none;background:#f2f2f4;display:flex;align-items:center;justify-content:center">${icon("left",16,"var(--brand)")}</button>
        <button data-action="week-next" aria-label="Volgende week" style="width:30px;height:30px;border-radius:15px;border:none;background:#f2f2f4;display:flex;align-items:center;justify-content:center">${icon("right",16,"var(--brand)")}</button>
      </div>
    </div>
    <div style="margin-top:8px">${filterChips()}</div>
  </div>
  <div class="weekgrid" id="weekgrid"><div style="width:${gridWidth + 48}px;position:relative">`;

  // Hour ruler, pinned to the top while the user scrolls vertically.
  html += `<div class="weekrow" style="height:24px;position:sticky;top:0;z-index:3;background:#fff;border-bottom:.5px solid #e5e5ea">
             <div class="daylabel" style="z-index:4"></div>`;
  for (let h = H0; h < H1; h++){
    html += `<div style="width:${PX}px;flex:none;font-size:10px;color:#8e8e93;padding:5px 0 0 3px;border-left:.5px solid #eee">${String(h).padStart(2,"0")}:00</div>`;
  }
  html += `</div>`;

  // One row per day.
  for (let i = 0; i < 7; i++){
    const day       = addDays(state.weekStart, i);
    const isToday   = sameDay(day, TODAY);
    const isWeekend = i > 4;

    html += `<div class="weekrow" style="height:${RH}px;border-bottom:.5px solid #e5e5ea">
      <div class="daylabel">
        <span style="font-size:10px;color:${isToday ? "var(--brand)" : "#8e8e93"}">${DAY_SHORT[i]}</span>
        <span style="width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:${isToday ? 700 : 500};${
          isToday ? "background:var(--brand);color:#fff" : isWeekend ? "color:#8e8e93" : ""
        }">${day.getDate()}</span>
      </div>
      <div style="position:relative;width:${gridWidth}px;flex:none;background:repeating-linear-gradient(90deg,transparent 0 ${PX-1}px,#f0f0f2 ${PX-1}px ${PX}px)">`;

    eventsOn(day).forEach(e => {
      const cat   = deptOf(e);
      const left  = (hmToDecimal(e.start) - H0) * PX + 1;
      const width = (hmToDecimal(e.end) - hmToDecimal(e.start)) * PX - 3;
      const tick  = state.supported.has(e.id) ? " " + icon("check",10,cat.ink) : "";
      // NOTE: short events give very little room for the title. If the school
      // finds them unreadable, raise CONFIG.hourWidthPx rather than shrinking type.
      html += `<button class="block" data-event="${e.id}"
        style="left:${left}px;width:${width}px;background:${cat.wash};color:${cat.ink};border-left:3px solid ${cat.colour}">
        <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.title)}</b>${e.start}${tick}</button>`;
    });

    html += `</div></div>`;
  }

  // "Now" line — only drawn when today falls inside the visible week.
  if (TODAY >= state.weekStart && TODAY <= addDays(weekEnd, 1)){
    const nowHours = TODAY.getHours() + TODAY.getMinutes() / 60;
    const x = 48 + (nowHours - H0) * PX;
    const label = `${String(TODAY.getHours()).padStart(2,"0")}:${String(TODAY.getMinutes()).padStart(2,"0")}`;
    html += `<div style="position:absolute;left:${x}px;top:24px;bottom:0;width:1.5px;background:var(--brand);z-index:1;pointer-events:none"></div>
             <div style="position:absolute;left:${x-15}px;top:3px;z-index:4;background:var(--brand);color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:8px">${label}</div>`;
  }

  return html + `</div></div>`;
}

/* --- 6c. Soek -----------------------------------------------------------
   Client-side filter over the loaded events. Fine at this scale (a school year
   is a few hundred events). TODO: server-side search once past ~1 000 events,
   and add team/grade as filter dimensions.
------------------------------------------------------------------------- */
function screenSearch(){
  return `<div class="content" style="padding:10px 16px">
    <h1 style="font-size:30px;font-weight:700;margin:0 0 10px">Soek</h1>
    <div style="display:flex;align-items:center;gap:8px;background:#eeeef0;border-radius:14px;height:42px;padding:0 12px">
      ${icon("search",18,"#8e8e93")}
      <input id="searchbox" value="${esc(state.query)}" placeholder="Rugby, koor, debat" aria-label="Soek geleenthede"
        style="flex:1;min-width:0;border:none;outline:none;background:transparent;height:38px;font-size:16px;color:#111">
      ${icon("mic",18,"#8e8e93")}
    </div>
    <div style="margin:12px 0">${filterChips()}</div>
    <div id="results">${searchResults()}</div>
  </div>`;
}

function searchResults(){
  const q = state.query.trim().toLowerCase();
  const matches = EVENTS
    .filter(passesFilter)
    .filter(e => !q || e.title.toLowerCase().includes(q)
                    || deptOf(e).name.toLowerCase().includes(q)
                    || e.venue.toLowerCase().includes(q))
    .sort((a,b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start))
    .slice(0, 7);   // TODO: paginate instead of truncating

  if (!matches.length){
    return `<p style="font-size:14px;color:#8e8e93">Geen resultate nie. Probeer 'n ander woord.</p>`;
  }

  return matches.map(e => {
    const day = toDate(e.date);
    const dept = deptOf(e);
    return `<div class="row-event" data-event="${e.id}" tabindex="0" role="button">
      <div style="width:40px;height:40px;border-radius:10px;background:${dept.wash};color:${dept.colour};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px">
        ${esc(dept.name.charAt(0).toUpperCase())}
      </div>
      <div style="flex:1;min-width:0">
        <div style="font-size:14px;font-weight:600">${esc(e.title)}</div>
        <div style="font-size:12px;color:#8e8e93">${day.getDate()} ${MONTHS[day.getMonth()].slice(0,3)}, ${e.start} · ${esc(dept.name)}</div>
      </div>
    </div>`;
  }).join("");
}

/* --- 6h. Excel export ------------------------------------------------------
   Builds a real .xlsx (not CSV) in the browser with no library: an .xlsx is
   a zip of a few XML files, written here uncompressed. Opens in Excel,
   Google Sheets and Numbers.
   POPIA: this file holds names + grades of minors. It leaves the system the
   moment it is downloaded — the school should say who may export and how
   long exports may be kept. TODO: log every export server-side.
------------------------------------------------------------------------- */
const CRC_TABLE = Array.from({ length:256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for (const b of bytes) crc = CRC_TABLE[(crc ^ b) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Minimal zip writer (method 0 = stored). files: [{ name, data:string }]
function zipStored(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);  local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);       // UTF-8 names
    local.setUint16(12, 0x21, true);        // date 1980-01-01
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
    local.setUint16(26, name.length, true);
    chunks.push(local, name, data);

    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true);  cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true);      cen.setUint16(14, 0x21, true);
    cen.setUint32(16, crc, true);
    cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
    cen.setUint16(28, name.length, true);
    cen.setUint32(42, offset, true);
    central.push(cen, name);
    offset += 30 + name.length + data.length;
  }
  const centralSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, end], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function xmlEsc(s){
  return String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
    .replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

// rows: array of arrays of strings. boldRows: row indexes (0-based) to bold.
function buildXlsx(sheetName, rows, boldRows, colWidths){
  const colLetter = i => String.fromCharCode(65 + i);   // A–Z is plenty here
  const sheetRows = rows.map((row, r) => `<row r="${r+1}">${row.map((v, c) =>
    `<c r="${colLetter(c)}${r+1}" t="inlineStr"${boldRows.includes(r) ? ' s="1"' : ""}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`).join("")}</row>`).join("");
  const cols = colWidths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const safeName = sheetName.replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31) || "Bywoning";
  const NS = "http://schemas.openxmlformats.org";
  return zipStored([
    { name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(safeName)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name:"xl/styles.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    { name:"xl/worksheets/sheet1.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}/spreadsheetml/2006/main"><cols>${cols}</cols><sheetData>${sheetRows}</sheetData></worksheet>` }
  ]);
}

// Rows for one event's attendance sheet. Kept separate so it can be tested.
function attendeeRows(e){
  const people = attendeesOf(e);
  return [
    [e.title],
    [`${e.date}  ${e.start}–${e.end}  ·  ${e.venue}  ·  ${deptOf(e).name}`],
    [`Totaal: ${people.length}`],
    [],
    ["Naam", "Van", "Graad", "E-pos"],
    ...people.map(p => [p.name, p.surname, p.grade, p.email])
  ];
}

function exportAttendees(e){
  if (!canAdmin(e)) return;   // TODO: the server must refuse too
  const blob = buildXlsx("Bywoning", attendeeRows(e), [0, 4], [18, 20, 20, 36]);
  const filename = `Bywoning - ${e.title} - ${e.date}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download:filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Excel-lêer afgelaai");
}

function toast(message){
  const t = Object.assign(document.createElement("div"), { className:"toast", textContent:message });
  document.getElementById("phone").appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ===========================================================================
   7. RENDER + EVENT HANDLING
   One render function, one delegated click handler. Every state change is
   followed by render() — no partial DOM updates except the search results,
   which re-render on keystroke so the input does not lose focus.
=========================================================================== */
const SCREENS = { manage:screenManage, create:screenCreate, calendar:screenCalendar, map:screenMap, search:screenSearch, mine:screenMine };

// Tabs per role. Admin tabs go in front: Bestuur (Hoof-admin), then Skep.
function tabsForRole(){
  const base = [["calendar","calendar","Kalender"], ["map","pin","Kaart"], ["search","search","Soek"], ["mine","heart","Myne"]];
  const role = roleOf();
  if (role === "key")  return [["manage","shield","Bestuur"], ["create","plus","Skep"], ...base];
  if (role === "dept") return [["create","plus","Skep"], ...base];
  return base;
}

const screenEl = document.getElementById("screen");
const tabbarEl = document.getElementById("tabbar");

function render(){
  // Not signed in: the auth screen replaces the whole app, tab bar included.
  tabbarEl.style.display = state.user ? "" : "none";
  if (!state.user){ screenEl.innerHTML = screenAuth(); return; }

  // Drop state that points at something that no longer exists or isn't allowed.
  const tabs = tabsForRole();
  if (!tabs.some(([id]) => id === state.tab)) state.tab = "calendar";
  if (state.openEventId != null && !eventById(state.openEventId)) state.openEventId = null;
  if (state.filter !== "Alles" && !DEPARTMENTS.some(d => d.id === state.filter)) state.filter = "Alles";

  screenEl.innerHTML = state.openEventId ? screenEventDetail() : SCREENS[state.tab]();

  tabbarEl.innerHTML = tabs.map(([id, iconName, label]) => {
    const active = id === state.tab && !state.openEventId;
    return `<button class="tab ${active ? "is-active" : ""}" role="tab" aria-selected="${active}" data-tab="${id}">${icon(iconName, 22)}${label}</button>`;
  }).join("");

  // Restore horizontal scroll, or land on the configured hour first time.
  const grid = document.getElementById("weekgrid");
  if (grid){
    const { initialScrollHour:SH, dayStartHour:H0 } = CONFIG;
    const PX = hourWidth();
    grid.scrollLeft = state.scrollLeft == null ? (SH - H0) * PX : state.scrollLeft;
    grid.addEventListener("scroll", () => { state.scrollLeft = grid.scrollLeft; });
  }

  const box = document.getElementById("searchbox");
  if (box){
    box.addEventListener("input", ev => {
      state.query = ev.target.value;
      document.getElementById("results").innerHTML = searchResults();
    });
  }
}

function handle(target){
  if (target.dataset.tab){
    state.tab = target.dataset.tab;
    state.openEventId = null;
  } else if (target.dataset.event){
    state.openEventId = Number(target.dataset.event);
  } else if (target.dataset.filter){
    state.filter = target.dataset.filter;
  } else {
    switch (target.dataset.action){
      case "back":           state.openEventId = null; break;
      case "toggle-support":
        // TODO: POST /api/events/:id/support  (and DELETE to undo)
        state.supported.has(state.openEventId)
          ? state.supported.delete(state.openEventId)
          : state.supported.add(state.openEventId);
        break;
      case "map-map":        state.mapMode = "map"; break;
      case "map-qr":         state.mapMode = "qr";  break;
      case "checkin":        state.checkedIn = !state.checkedIn; break;  // TODO: real check-in
      case "week-prev":      state.weekStart = addDays(state.weekStart, -7); state.scrollLeft = null; break;
      case "week-next":      state.weekStart = addDays(state.weekStart,  7); state.scrollLeft = null; break;
      case "auth-mode-signup":
      case "auth-mode-signin": {
        // Keep whatever was typed when switching between Registreer and Teken in.
        const form = document.querySelector('[data-form="auth-details"]');
        if (form) state.auth.draft = { ...state.auth.draft, ...Object.fromEntries(new FormData(form)) };
        state.auth.mode = target.dataset.action.slice("auth-mode-".length);
        break;
      }
      case "auth-back":      state.auth.step = "details"; break;
      case "auth-resend":    alert("Nuwe kode gestuur (prototipe)."); return;   // TODO: call signInWithOtp again
      case "signout":        // TODO: supabase.auth.signOut()
        state.user = null; saveJSON("garsie.user", null);
        state.auth = { mode: "signin", step: "details", draft: {} };
        state.tab = "calendar"; state.openEventId = null; state.editingId = null;
        break;

      // --- Admin actions. Each re-checks permission; the UI hiding a button isn't enough.
      case "new-event":      state.editingId = null; state.tab = "create"; state.openEventId = null; break;
      case "edit-event": {
        const e = eventById(Number(target.dataset.id));
        if (!e || !canAdmin(e)) return;
        state.editingId = e.id; state.tab = "create"; state.openEventId = null;
        break;
      }
      case "cancel-edit":    state.editingId = null; break;
      case "export": {
        const e = eventById(Number(target.dataset.id));
        if (e) exportAttendees(e);
        return;
      }
      case "delete-event": {
        const e = eventById(Number(target.dataset.id));
        if (!e || !canAdmin(e) || !confirm(`Skrap "${e.title}"? Dit kan nie ontdoen word nie.`)) return;
        EVENTS = EVENTS.filter(x => x.id !== e.id);
        state.supported.delete(e.id);
        if (state.editingId === e.id) state.editingId = null;
        persistData(); toast("Geleentheid geskrap");
        break;
      }
      case "delete-dept": {
        if (roleOf() !== "key") return;
        const d = DEPARTMENTS.find(d => d.id === target.dataset.id);
        if (!d || !confirm(`Skrap departement "${d.name}"?`)) return;
        DEPARTMENTS = DEPARTMENTS.filter(x => x.id !== d.id);
        persistData(); toast("Departement geskrap");
        break;
      }
      case "delete-admin": {
        const admin = ADMINS.find(a => a.email === target.dataset.email);
        if (roleOf() !== "key" || !admin || isLastKeyAdmin(admin)) return;
        ADMINS = ADMINS.filter(a => a !== admin);
        persistData(); toast("Admin verwyder");
        break;
      }
      case "reset-data":
        if (roleOf() !== "key" || !confirm("Herstel al die voorbeelddata? Alles wat jy geskep het, gaan verlore.")) return;
        resetData(); state.editingId = null; toast("Voorbeelddata herstel");
        break;
      default: return;
    }
  }
  render();
}

// Re-layout the calendar when the window is resized or the phone is rotated.
let resizeFrame = null;
window.addEventListener("resize", () => {
  cancelAnimationFrame(resizeFrame);
  resizeFrame = requestAnimationFrame(() => {
    // Guard on state.user: the phone keyboard opening fires resize, and
    // re-rendering the auth screen would wipe what the user is typing.
    if (state.user && state.tab === "calendar" && !state.openEventId){ state.scrollLeft = null; render(); }
  });
});

const phoneEl = document.getElementById("phone");
phoneEl.addEventListener("click", ev => {
  const target = ev.target.closest("[data-tab],[data-event],[data-action],[data-filter]");
  // Let real links (the Quicket button) behave like links.
  if (target && !ev.target.closest("a")) handle(target);
});
// All forms. Auth is PROTOTYPE: accepts anything, including empty fields and any code.
phoneEl.addEventListener("submit", ev => {
  ev.preventDefault();
  const form = ev.target;
  const data = Object.fromEntries(new FormData(form));
  const auth = state.auth;

  if (form.dataset.form === "auth-details"){
    auth.draft = { ...auth.draft, ...data };
    if (auth.mode === "signin"){
      // Sign in only asks for email; reuse the name/grade from a previous sign-up on this device.
      // TODO: with Supabase the profile comes back from the session instead.
      const known = loadJSON("garsie.profile");
      if (known && known.email === auth.draft.email) auth.draft = { ...known, role: data.role, department: data.department };
    }
    auth.step = "code";
  } else if (form.dataset.form === "auth-code"){
    const { email = "", name = "", surname = "", grade = "", role = "user" } = auth.draft;
    const department = role === "dept" ? (auth.draft.department || (DEPARTMENTS[0] && DEPARTMENTS[0].id)) : null;
    state.user = { email, name, surname, grade, role, department };
    saveJSON("garsie.user", state.user);
    saveJSON("garsie.profile", state.user);
    state.auth = { mode: "signin", step: "details", draft: {} };
    state.tab = "calendar"; state.editingId = null;
  } else if (form.dataset.form === "event"){
    saveEventForm(data);
  } else if (form.dataset.form === "dept"){
    if (roleOf() !== "key") return;
    const name = (data.name || "").trim();
    if (!name){ toast("Gee die departement 'n naam"); return; }
    if (DEPARTMENTS.some(d => d.name.toLowerCase() === name.toLowerCase())){ toast("Daardie departement bestaan reeds"); return; }
    DEPARTMENTS = [...DEPARTMENTS, { id: "d" + Date.now().toString(36), name, colour: data.colour || "#8e8e93" }];
    persistData(); toast(`${name} bygevoeg`);
  } else if (form.dataset.form === "admin"){
    if (roleOf() !== "key") return;
    const email = (data.email || "").trim().toLowerCase();
    if (!email){ toast("Tik 'n e-posadres in"); return; }
    if (ADMINS.some(a => a.email === email)){ toast("Hierdie persoon is reeds 'n admin"); return; }
    // TODO: Supabase — this row is what decides the user's role at sign-in.
    ADMINS = [...ADMINS, { email, role: data.role, department: data.role === "dept" ? data.department : null }];
    persistData(); toast("Admin bygevoeg");
  }
  render();
});

// Create / update an event from the Skep form. Lenient on purpose: missing
// fields get sensible defaults rather than blocking the admin.
function saveEventForm(data){
  const allowed = adminDepartments();
  if (!allowed.length) return;
  // A disabled <select> (Departement-admin) isn't submitted, so fall back to their department.
  const department = allowed.some(d => d.id === data.department) ? data.department : allowed[0].id;
  let { start = "15:00", end = "16:00" } = data;
  start = start || "15:00";
  if (!end || end <= start){                              // end must be after start
    const [h, m] = start.split(":").map(Number);
    end = `${String(Math.min(h + 1, 23)).padStart(2,"0")}:${String(m).padStart(2,"0")}`;
  }
  const ticketUrl = /^https?:\/\//i.test((data.ticketUrl || "").trim()) ? data.ticketUrl.trim() : null;
  const fields = {
    title: (data.title || "").trim() || "Nuwe geleentheid",
    department, date: data.date || toISO(TODAY), start, end,
    venue: (data.venue || "").trim(), description: (data.description || "").trim(), ticketUrl
  };

  const existing = state.editingId != null ? eventById(state.editingId) : null;
  if (existing){
    if (!canAdmin(existing)) return;
    EVENTS = EVENTS.map(e => e.id === existing.id ? { ...e, ...fields } : e);
    toast("Veranderinge gestoor");
  } else {
    EVENTS = [...EVENTS, { id: Date.now(), ...fields }];
    toast("Geleentheid geskep");
  }
  state.editingId = null;
  persistData();
}

// Dropdowns that change something straight away, without a submit button.
phoneEl.addEventListener("change", ev => {
  const el = ev.target;
  if (el.name === "role" && el.closest('[data-form="auth-details"]')){
    document.getElementById("auth-dept").style.display = el.value === "dept" ? "" : "none";
  } else if (el.name === "role" && el.closest('[data-form="admin"]')){
    document.getElementById("new-admin-dept").style.display = el.value === "dept" ? "" : "none";
  } else if (el.dataset.adminDept && roleOf() === "key"){
    ADMINS = ADMINS.map(a => a.email === el.dataset.adminDept ? { ...a, department: el.value } : a);
    persistData(); toast("Departement opgedateer");
  } else if (el.dataset.deptColour && roleOf() === "key"){
    DEPARTMENTS = DEPARTMENTS.map(d => d.id === el.dataset.deptColour ? { ...d, colour: el.value } : d);
    persistData(); render();
  }
});

phoneEl.addEventListener("keydown", ev => {
  if (ev.key !== "Enter" && ev.key !== " ") return;
  const target = ev.target.closest("[data-event]");
  if (target && target.tagName !== "BUTTON" && target.tagName !== "A"){
    ev.preventDefault();
    handle(target);
  }
});

/* --- Prototype-only chrome: jump buttons and the fake status bar --------- */
document.getElementById("statusicons").innerHTML = icon("wifi", 15);
document.getElementById("clock").textContent =
  `${String(TODAY.getHours()).padStart(2,"0")}:${String(TODAY.getMinutes()).padStart(2,"0")}`;

[["Kalender",  () => { state.tab = "calendar"; state.openEventId = null; }],
 ["Kaart",     () => { state.tab = "map"; state.openEventId = null; state.mapMode = "map"; }],
 ["Soek",      () => { state.tab = "search"; state.openEventId = null; }],
 ["Geleentheid", () => { state.openEventId = 2; }],
 ["My geleenthede", () => { state.tab = "mine"; state.openEventId = null; }]
].forEach(([label, fn]) => {
  const btn = document.createElement("button");
  btn.textContent = label;
  btn.addEventListener("click", () => { fn(); render(); });
  document.getElementById("jump").appendChild(btn);
});

render();
</script>
