/* --- 6h. Excel export ------------------------------------------------------
   Builds a real .xlsx (not CSV) in the browser with no library: an .xlsx is
   a zip of a few XML files, written here uncompressed. Opens in Excel,
   Google Sheets and Numbers.
   POPIA: this file holds names + grades of minors. It leaves the system the
   moment it is downloaded — the school should say who may export and how
   long exports may be kept. TODO: log every export server-side.
------------------------------------------------------------------------- */
const CRC_TABLE = Array.from({ length:256 }, (_, n) => {
  let c = n;
  for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1;
  return c >>> 0;
});
function crc32(bytes){
  let crc = 0xFFFFFFFF;
  for (const b of bytes) crc = CRC_TABLE[(crc ^ b) & 0xFF] ^ (crc >>> 8);
  return (crc ^ 0xFFFFFFFF) >>> 0;
}

// Minimal zip writer (method 0 = stored). files: [{ name, data:string }]
function zipStored(files){
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  for (const f of files){
    const name = enc.encode(f.name), data = enc.encode(f.data), crc = crc32(data);
    const local = new DataView(new ArrayBuffer(30));
    local.setUint32(0, 0x04034b50, true);  local.setUint16(4, 20, true);
    local.setUint16(6, 0x0800, true);       // UTF-8 names
    local.setUint16(12, 0x21, true);        // date 1980-01-01
    local.setUint32(14, crc, true);
    local.setUint32(18, data.length, true); local.setUint32(22, data.length, true);
    local.setUint16(26, name.length, true);
    chunks.push(local, name, data);

    const cen = new DataView(new ArrayBuffer(46));
    cen.setUint32(0, 0x02014b50, true);  cen.setUint16(4, 20, true); cen.setUint16(6, 20, true);
    cen.setUint16(8, 0x0800, true);      cen.setUint16(14, 0x21, true);
    cen.setUint32(16, crc, true);
    cen.setUint32(20, data.length, true); cen.setUint32(24, data.length, true);
    cen.setUint16(28, name.length, true);
    cen.setUint32(42, offset, true);
    central.push(cen, name);
    offset += 30 + name.length + data.length;
  }
  const centralSize = central.reduce((n, p) => n + p.byteLength, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true); end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true); end.setUint32(16, offset, true);
  return new Blob([...chunks, ...central, end], { type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}

function xmlEsc(s){
  return String(s ?? "").replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, "")
    .replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
}

// rows: array of arrays of strings. boldRows: row indexes (0-based) to bold.
function buildXlsx(sheetName, rows, boldRows, colWidths){
  const colLetter = i => String.fromCharCode(65 + i);   // A–Z is plenty here
  const sheetRows = rows.map((row, r) => `<row r="${r+1}">${row.map((v, c) =>
    `<c r="${colLetter(c)}${r+1}" t="inlineStr"${boldRows.includes(r) ? ' s="1"' : ""}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`).join("")}</row>`).join("");
  const cols = colWidths.map((w, i) => `<col min="${i+1}" max="${i+1}" width="${w}" customWidth="1"/>`).join("");
  const safeName = sheetName.replace(/[\[\]:*?\/\\]/g, " ").slice(0, 31) || "Bywoning";
  const NS = "http://schemas.openxmlformats.org";
  return zipStored([
    { name:"[Content_Types].xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${NS}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>` },
    { name:"_rels/.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>` },
    { name:"xl/workbook.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${NS}/spreadsheetml/2006/main" xmlns:r="${NS}/officeDocument/2006/relationships"><sheets><sheet name="${xmlEsc(safeName)}" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name:"xl/_rels/workbook.xml.rels", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${NS}/package/2006/relationships"><Relationship Id="rId1" Type="${NS}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="${NS}/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>` },
    { name:"xl/styles.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="${NS}/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    { name:"xl/worksheets/sheet1.xml", data:`<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="${NS}/spreadsheetml/2006/main"><cols>${cols}</cols><sheetData>${sheetRows}</sheetData></worksheet>` }
  ]);
}

// Rows for one event's attendance sheet, from event_attendees() in the database:
// [{ name, surname, grade, gender, email, supports, checked_in_at, method, distance_m, flags }]
function attendeeRows(e, list){
  const all = (list || []).map(p => ({ ...p, flags: p.flags || [] }));
  const suspicious = all.filter(p => p.checked_in_at && p.flags.length);
  const people = all.filter(p => p.supports || (p.checked_in_at && !p.flags.length));
  const checkedIn = people.filter(p => p.checked_in_at && !p.flags.length).length;
  const rows = [
    [e.title],
    [`${e.date}  ${e.start}–${e.end}  ·  ${e.venue}  ·  ${deptOf(e).name}${hasAudience(e) ? `  ·  Net vir: ${audienceLabel(e)}` : ""}`],
    [`Totaal: ${people.length}  ·  Aangemeld: ${checkedIn}  ·  Verdag: ${suspicious.length}`],
    [],
    ["Naam", "Van", "Graad", "Geslag", "E-pos", "Ondersteun", "Aangemeld"],
    ...people.map(p => [p.name, p.surname, p.grade, p.gender || "", p.email, p.supports ? "Ja" : "Nee",
                        p.checked_in_at && !p.flags.length ? `${formatDateTime(p.checked_in_at)} · ${METHOD_LABELS[p.method] || "GPS"}${p.distance_m != null ? ` (${p.distance_m} m)` : ""}` : ""]),
    []
  ];
  const bold = [0, 4, rows.length];
  // Separate section so an admin can check these before counting them.
  rows.push(["Verdagte aanmeldings — gaan asseblief na"]);
  if (suspicious.length){
    bold.push(rows.length);
    rows.push(["Naam", "Van", "Graad", "Geslag", "E-pos", "Tyd", "Metode", "Rede"]);
    suspicious.forEach(p => rows.push([p.name, p.surname, p.grade, p.gender || "", p.email,
      formatDateTime(p.checked_in_at), METHOD_LABELS[p.method] || "GPS", p.flags.join("; ")]));
  } else {
    rows.push(["Geen."]);
  }
  return { rows, bold };
}

function formatDateTime(iso){                // ISO -> "2026-09-24 16:40", local time
  const d = new Date(iso), p = n => String(n).padStart(2,"0");
  return `${toISO(d)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

async function exportAttendees(e){
  if (!canAdmin(e)) return;                   // the database refuses non-admins too
  toast("Die Excel-lêer word voorberei…");
  const { data, error } = await fetchAll(() => sb.rpc("event_attendees", { p_event_id:e.id }).order("email"));
  if (error){ toast(dbMessage(error)); return; }
  const { rows, bold } = attendeeRows(e, data);
  const blob = buildXlsx("Bywoning", rows, bold, [18, 20, 20, 10, 36, 22, 30, 50]);
  const filename = `Bywoning - ${e.title} - ${e.date}.xlsx`.replace(/[\\/:*?"<>|]/g, "-");
  const url = URL.createObjectURL(blob);
  const a = Object.assign(document.createElement("a"), { href:url, download:filename });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast("Excel-lêer afgelaai");
}

function toast(message){
  const t = Object.assign(document.createElement("div"), { className:"toast", textContent:message });
  document.getElementById("phone").appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

/* ===========================================================================
   7. RENDER + EVENT HANDLING
   One render function, one delegated click handler. Every state change is
   followed by render() — no partial DOM updates except the search results,
   which re-render on keystroke so the input does not lose focus.
=========================================================================== */
const SCREENS = { manage:screenManage, create:screenCreate, calendar:screenCalendar, map:screenMap, search:screenSearch, mine:screenMine };

// Tabs per role. Admin tabs go in front: Bestuur (Hoof-admin), then Skep.
function tabsForRole(){
  const calendar = ["calendar","calendar","Kalender"], map = ["map","pin","Kaart"],
        search = ["search","search","Soek"], mine = ["mine","heart","My program"];
  const role = roleOf();
  // Admins don't check in, so they get no Kaart tab (pins are set in Skep).
  if (role === "key")  return [["manage","shield","Bestuur"], ["create","plus","Skep"], calendar, search, mine];
  if (role === "dept") return [["create","plus","Skep"], calendar, search, mine];
  return [calendar, map, search, mine];
}

const screenEl = document.getElementById("screen");
const tabbarEl = document.getElementById("tabbar");

function render(){
  // Not signed in: the auth screen replaces the whole app, tab bar included.
  tabbarEl.style.display = state.user && !state.loading && !state.needsConsent ? "" : "none";
  const gearBtn = document.getElementById("settings-btn");
  gearBtn.style.display = tabbarEl.style.display === "none" || state.preview ? "none" : "";
  const banner = document.getElementById("preview-banner");
  banner.style.display = state.preview && state.user ? "" : "none";
  if (state.preview) banner.innerHTML = `<span>${icon("eye",15,"#fff")} Leerder-aansig · ${esc(state.preview.grade)}${state.preview.gender ? " · " + esc(state.preview.gender) : ""}</span>
    <button data-action="end-preview">Verlaat</button>`;
  gearBtn.innerHTML = icon("gear", 19);
  gearBtn.classList.toggle("on", !!state.settingsOpen);
  unmountMaps(); stopScanner(); stopQrTicker();
  if (state.loading || (state.fatal && !state.user)){ screenEl.innerHTML = screenLoading(); startLoader(); return; }
  if (state.session && state.needsProfile){ screenEl.innerHTML = screenProfile(); return; }
  if (state.session && state.needsConsent){ screenEl.innerHTML = screenConsent(); return; }
  if (!state.user){ screenEl.innerHTML = screenAuth(); return; }

  // Drop state that points at something that no longer exists or isn't allowed.
  const tabs = tabsForRole();
  if (!tabs.some(([id]) => id === state.tab)) state.tab = "calendar";
  if (state.openEventId != null && !(eventById(state.openEventId) && isForUser(eventById(state.openEventId)))) state.openEventId = null;
  if (state.filter !== "Alles" && !DEPARTMENTS.some(d => d.id === state.filter)) state.filter = "Alles";
  if (state.qrEventId != null && !(eventById(state.qrEventId) && canAdmin(eventById(state.qrEventId)))) state.qrEventId = null;

  const keepMonthScroll = (document.getElementById("monthview") || {}).scrollTop;
  screenEl.innerHTML = state.settingsOpen ? screenSettings()
                     : state.qrEventId != null ? screenQr()
                     : state.openEventId ? screenEventDetail() : SCREENS[state.tab]();
  mountMaps();
  if (!maybeOfferInstall()) maybeOfferPush();
  if (state.qrEventId != null) startQrTicker();

  tabbarEl.innerHTML = tabs.map(([id, iconName, label]) => {
    const active = id === state.tab && !state.openEventId && state.qrEventId == null;
    return `<button class="tab ${active ? "is-active" : ""}" role="tab" aria-selected="${active}" data-tab="${id}">${icon(iconName, 22)}${label}</button>`;
  }).join("");

  // Week view: restore horizontal scroll, or start near "now" (this week)
  // or at the usual afternoon hour (other weeks).
  const grid = document.getElementById("weekgrid");
  if (grid){
    const [H0, , PX] = state.calHours;
    const firstHour = sameDay(state.weekStart, mondayOf(TODAY)) ? TODAY.getHours() - 2 : CONFIG.initialScrollHour;
    grid.scrollLeft = state.scrollLeft == null ? Math.max(0, firstHour - H0) * PX : state.scrollLeft;
    grid.addEventListener("scroll", () => { state.scrollLeft = grid.scrollLeft; });
  }

  const monthView = document.getElementById("monthview");
  if (monthView && keepMonthScroll) monthView.scrollTop = keepMonthScroll;

  const box = document.getElementById("searchbox");
  if (box){
    box.addEventListener("input", ev => {
      state.query = ev.target.value;
      document.getElementById("results").innerHTML = searchResults();
    });
  }
}

function handle(target){
  if (target.dataset.tab){
    state.tab = target.dataset.tab;
    state.qrEventId = null;
    state.openEventId = null;
    state.settingsOpen = false;
  } else if (target.dataset.event){
    state.openEventId = Number(target.dataset.event);
  } else if (target.dataset.filter){
    state.filter = target.dataset.filter;
  } else {
    switch (target.dataset.action){
      case "back":           state.openEventId = null; break;
      case "toggle-support": {
        const e = eventById(state.openEventId);
        if (!e || !isForUser(e)) return;
        toggleSupport(e);
        return;
      }
      case "map-map":        state.mapMode = "map"; break;
      case "map-qr":         state.mapMode = "qr";  break;
      // --- Location + check-in. These update in place instead of re-rendering,
      // so the map keeps its position and a half-filled Skep form isn't wiped.
      case "start-location": startLocation(); return;
      case "checkin":        checkIn(); return;
      case "locate-me":
        if (geo.status === "on" && geo.pos && kaart.map) kaart.map.setView([geo.pos.lat, geo.pos.lng], 17);
        else startLocation();
        return;
      case "open-map":
        state.mapEventId = Number(target.dataset.id); state.tab = "map"; state.mapMode = "map"; state.openEventId = null;
        break;
      case "geocode":        geocodeAddress(); return;
      case "pick-geocode":
        setPickerPoint({ lat:Number(target.dataset.lat), lng:Number(target.dataset.lng) }, target.dataset.label, 17);
        document.getElementById("geo-results").innerHTML = "";
        return;
      case "pick-my-location": useMyLocationForPin(); return;

      // --- QR
      case "show-qr": {
        const e = eventById(Number(target.dataset.id));
        if (!e || !canAdmin(e)) return;
        state.qrEventId = e.id; state.qrMode = "live";
        break;
      }
      case "close-qr":       state.qrEventId = null; break;
      case "qr-mode-live":   state.qrMode = "live"; break;
      case "qr-mode-print":  state.qrMode = "print"; break;
      case "print-qr":       window.print(); return;
      case "start-scan":     startScanner(); return;
      case "stop-scan":      stopScanner(); setScan("idle", ""); return;
      // --- Calendar
      case "cal-view-week":
      case "cal-view-month":
        state.calView = target.dataset.action === "cal-view-month" ? "month" : "week";
        saveJSON("garsie.calView", state.calView);
        goToDate(toDate(state.selectedDate));
        break;
      case "cal-today":      goToDate(TODAY); break;
      case "cal-prev":
      case "cal-next": {
        const dir = target.dataset.action === "cal-next" ? 1 : -1;
        if (state.calView === "month"){
          const m = new Date(state.monthStart.getFullYear(), state.monthStart.getMonth() + dir, 1);
          const hasToday = m.getMonth() === TODAY.getMonth() && m.getFullYear() === TODAY.getFullYear();
          goToDate(hasToday ? TODAY : m);
        } else {
          goToDate(addDays(toDate(state.selectedDate), 7 * dir));
        }
        break;
      }
      case "cal-jump": {
        const input = document.getElementById("date-jump");
        if (input){ try { input.showPicker(); } catch { input.focus(); input.click(); } }
        return;
      }
      case "pick-day":
        if (!isValidISODate(target.dataset.date)) return;
        goToDate(toDate(target.dataset.date));
        break;
      case "show-week":
        state.calView = "week"; saveJSON("garsie.calView", "week");
        goToDate(toDate(state.selectedDate));
        break;
      case "auth-mode-signup":
      case "auth-mode-signin": {
        // Keep whatever was typed when switching between Registreer and Teken in.
        const form = document.querySelector('[data-form="auth-details"]');
        if (form) state.auth.draft = { ...state.auth.draft, ...Object.fromEntries(new FormData(form)) };
        state.auth.mode = target.dataset.action.slice("auth-mode-".length);
        break;
      }
      case "auth-back":      state.auth.step = "details"; break;
      case "privacy-open":   openPrivacy(); return;
      case "auth-google":    signInWithGoogle(); return;
      case "auth-resend": {
        const wait = Math.ceil(RESEND_WAIT_S - (Date.now() - (state.auth.sentAt || 0)) / 1000);
        if (wait > 0){ toast(`Wag nog ${wait} ${wait === 1 ? "sekonde" : "sekondes"} voordat jy weer 'n kode vra.`); return; }
        sendCode(state.auth.draft, state.auth.mode === "signup").then(err => toast(err || "Nuwe kode gestuur."));
        return;
      }
      case "signout":        signOut(); return;
      case "open-settings":  state.settingsOpen = !state.settingsOpen; state.openEventId = null; state.qrEventId = null; break;
      case "close-settings": state.settingsOpen = false; state.settingsPage = null; break;
      case "settings-page":  state.settingsPage = target.dataset.page || null; if (!state.settingsPage) state.learnerEdit = null; break;
      case "end-preview":    endPreview(); return;
      case "delete-account": openDeleteAccount(); return;
      case "push-on":        enablePush(); return;
      case "install-help":   openInstallHelp(); return;
      case "push-off":       disablePush(); return;
      case "push-test":      testPush(); return;
      case "push-new":       toggleNotifyNew(); return;

      // --- Admin actions. Each re-checks permission; the UI hiding a button isn't enough.
      case "new-event":      state.editingId = null; state.tab = "create"; state.openEventId = null; break;
      case "edit-event": {
        const e = eventById(Number(target.dataset.id));
        if (!e || !canAdmin(e)) return;
        state.editingId = e.id; state.tab = "create"; state.openEventId = null;
        break;
      }
      case "cancel-edit":    state.editingId = null; break;
      case "export": {
        const e = eventById(Number(target.dataset.id));
        if (e) exportAttendees(e);
        return;
      }
      case "delete-event": {
        const e = eventById(Number(target.dataset.id));
        if (!e || !canAdmin(e) || !confirm(`Skrap "${e.title}"? Almal se ondersteuning en aanmeldings daarvoor word ook geskrap. Dit kan nie ongedaan gemaak word nie.`)) return;
        if (state.editingId === e.id) state.editingId = null;
        dbAction(() => sb.from("events").delete().eq("id", e.id), "Geleentheid geskrap");
        return;
      }
      case "delete-dept": {
        if (roleOf() !== "key") return;
        const d = DEPARTMENTS.find(d => d.id === target.dataset.id);
        if (!d) return;
        // The button is disabled for these, but check again anyway.
        if (EVENTS.some(e => e.department === d.id) || ADMINS.some(a => a.role === "dept" && a.department === d.id)){
          toast("Skuif of skrap eers hierdie departement se geleenthede en admins."); return;
        }
        if (!confirm(`Skrap departement "${d.name}"?`)) return;
        dbAction(() => sb.from("departments").delete().eq("id", d.id), "Departement geskrap");
        return;
      }
      case "delete-admin": {
        const admin = ADMINS.find(a => a.email === target.dataset.email);
        if (roleOf() !== "key" || !admin || isLastKeyAdmin(admin)) return;
        if (!confirm(`Verwyder ${admin.email} as admin?`)) return;
        dbAction(() => sb.from("admins").delete().eq("email", admin.email), "Admin verwyder");
        return;
      }
      default: return;
    }
  }
  render();
}

    // re-rendering the auth screen would wipe what the user is typing.
    if (state.user && state.tab === "calendar" && !state.openEventId){ state.scrollLeft = null; render(); }

});

// All forms. Each checks its input and shows messages next to the fields;
// nothing is saved until everything is right. Saving goes to Supabase, which
// checks the same rules again (the browser can be bypassed).
phoneEl.addEventListener("submit", async ev => {
  ev.preventDefault();
  const form = ev.target;
  if (form.dataset.busy) return;                 // no double submits
  if (previewBlocks()) return;                   // nothing is saved in the learner preview
  const data = Object.fromEntries(new FormData(form));
  const auth = state.auth;
  const busy = on => {
    form.dataset.busy = on ? "1" : "";
    const b = form.querySelector('[type="submit"]');
    if (b){ if (on){ b.dataset.label = b.textContent; b.textContent = "Besig…"; } else if (b.dataset.label) b.textContent = b.dataset.label; b.disabled = on; }
  };

  if (form.dataset.form === "auth-details"){
    const isSignup = auth.mode === "signup";
    const email = normEmail(data.email);
    let v = { email }, errors = {};
    if (!email) errors.email = "Tik jou e-posadres in.";
    else if (!isEmail(email)) errors.email = "Dit lyk nie soos 'n e-posadres nie (bv. naam@voorbeeld.co.za).";
    if (isSignup){
      const [p, pe] = checkProfile(data);
      v = { ...v, ...p, popia: data.popia === "on" }; errors = { ...errors, ...pe };
      if (!v.popia) errors.popia = "Jy moet die privaatheidskennisgewing aanvaar om te registreer.";
    }
    if (!showErrors(form, errors)) return;

    busy(true);
    if (isSignup){
      const { data:taken, error } = await sb.rpc("email_registered", { p_email: email });
      if (!error && taken){ busy(false); showErrors(form, { email: "Hierdie e-posadres is reeds geregistreer. Kies \"Teken in\" hierbo." }); return; }
    }
    const err = await sendCode(v, isSignup);
    busy(false);
    if (err){ showErrors(form, { email: err }); return; }
    auth.draft = v;
    auth.step = "code";
    render();
    return;
  }

  if (form.dataset.form === "auth-code"){
    const code = String(data.code || "").replace(/\D/g, "");
    if (!showErrors(form, code.length === 6 ? {} : { code: "Tik die 6 syfers van die kode in." })) return;
    if (!auth.draft.email){ auth.step = "details"; render(); return; }
    busy(true);
    const { data:res, error } = await sb.auth.verifyOtp({ email: auth.draft.email, token: code, type: "email" });
    if (error){ busy(false); showErrors(form, { code: isNetworkError(error) ? dbMessage(error) : "Die kode is verkeerd of het verval. Probeer weer of vra 'n nuwe kode." }); return; }
    state.session = res.session;
    state.auth = { mode: "signin", step: "details", draft: {} };
    state.tab = "calendar"; state.editingId = null;
    state.loading = true; state.loaderShownAt = 0; render();
    await loadAll();
    await loaderMinimum();
    state.loading = false; render();
    processPendingScan();      // a QR opened before signing in
    syncOutbox();
    return;
  }

  if (form.dataset.form === "profile"){
    const [p, errors] = checkProfile(data);
    if (data.popia !== "on") errors.popia = "Jy moet die privaatheidskennisgewing aanvaar om voort te gaan.";
    if (!showErrors(form, errors)) return;
    busy(true);
    const u = state.session.user;
    // popia_accepted_at: the server replaces it with its own clock.
    const { error } = await sb.from("profiles").insert({ id:u.id, email:(u.email || "").toLowerCase(), name:p.name, surname:p.surname,
                                                       grade:p.grade, gender:p.gender || null, popia_accepted_at:new Date().toISOString() });
    busy(false);
    if (error){ toast(dbMessage(error)); return; }
    await loadAll(); render();
    return;
  }

  if (form.dataset.form === "find-learner"){
    if (roleOf() !== "key") return;
    const email = normEmail(data.email);
    if (!showErrors(form, !email ? { email:"Tik die leerder se e-posadres in." } : !isEmail(email) ? { email:"Dit lyk nie soos 'n e-posadres nie." } : {})) return;
    busy(true);
    const { data:rows, error } = await sb.rpc("admin_get_learner", { p_email:email });
    busy(false);
    if (error){ toast(dbMessage(error)); return; }
    if (!rows || !rows.length){ state.learnerEdit = null; render(); showErrors(document.querySelector('[data-form="find-learner"]'), { email:"Niemand met hierdie e-posadres het al geregistreer nie." }); return; }
    state.learnerEdit = { email, ...rows[0], gender: rows[0].gender || "" };
    render();
    return;
  }

  if (form.dataset.form === "edit-learner"){
    if (roleOf() !== "key" || !state.learnerEdit) return;
    const [p, errors] = checkProfile(data);
    if (!showErrors(form, errors)) return;
    busy(true);
    const { data:ok, error } = await sb.rpc("admin_set_learner", { p_email:state.learnerEdit.email, p_name:p.name, p_surname:p.surname, p_grade:p.grade, p_gender:p.gender || "" });
    busy(false);
    if (error){ toast(dbMessage(error)); return; }
    if (!ok){ toast("Die leerder bestaan nie meer nie."); return; }
    state.learnerEdit = { ...state.learnerEdit, ...p };
    toast(`${p.name} ${p.surname} is bygewerk`);
    render();
    return;
  }

  if (form.dataset.form === "start-preview"){
    if (roleOf() !== "key") return;
    const errors = {};
    if (!GRADES.includes(data.grade)) errors.grade = "Kies 'n graad.";
    else if (LEARNER_GRADES.includes(data.grade) && !GENDERS.includes(data.gender)) errors.gender = "Kies seun of meisie.";
    if (!showErrors(form, errors)) return;
    startPreview(data.grade, data.gender);
    return;
  }

  if (form.dataset.form === "consent"){
    if (!showErrors(form, data.popia === "on" ? {} : { popia: "Merk die blokkie om voort te gaan." })) return;
    busy(true);
    const { error } = await sb.from("profiles").update({ popia_accepted_at:new Date().toISOString() }).eq("id", state.session.user.id);
    busy(false);
    if (error){ toast(dbMessage(error)); return; }
    await loadAll(); render();
    return;
  }

  if (form.dataset.form === "event"){
    busy(true);
    const errors = await saveEventForm({ ...data, grades: new FormData(form).getAll("grades") });
    busy(false);
    if (!showErrors(form, errors)) return;
    render();
    return;
  }

  if (form.dataset.form === "dept"){
    if (roleOf() !== "key") return;
    const errors = {};
    const name = cleanText(data.name, LIMITS.deptName);
    if (!name) errors.name = "Gee die departement 'n naam.";
    else if (name.length < 2) errors.name = "Die naam is te kort.";
    else if (!isDeptName(name)) errors.name = "Net letters, syfers, spasies en - & ' ( ) asseblief.";
    else if (DEPARTMENTS.some(d => d.name.toLowerCase() === name.toLowerCase())) errors.name = "Daardie departement bestaan reeds.";
    const colourError = colourProblem(data.colour);
    if (colourError) errors.colour = colourError;
    if (!showErrors(form, errors)) return;
    busy(true);
    const { error } = await sb.from("departments").insert({ name, colour: data.colour.toLowerCase() });
    busy(false);
    if (error){ showErrors(form, { name: error.code === "23505" ? "Daardie departement bestaan reeds." : dbMessage(error) }); return; }
    toast(`${name} bygevoeg`);
    await loadAll(); render();
    return;
  }

  if (form.dataset.form === "admin"){
    if (roleOf() !== "key") return;
    const errors = {};
    const email = normEmail(data.email);
    if (!email) errors.email = "Tik 'n e-posadres in.";
    else if (!isEmail(email)) errors.email = "Dit lyk nie soos 'n e-posadres nie.";
    else if (ADMINS.some(a => a.email === email)) errors.email = "Hierdie persoon is reeds 'n admin.";
    const role = data.role === "key" ? "key" : "dept";
    if (role === "dept" && !DEPARTMENTS.some(d => d.id === data.department)){
      errors.department = DEPARTMENTS.length ? "Kies 'n departement." : "Skep eers 'n departement.";
    }
    if (!showErrors(form, errors)) return;
    busy(true);
    const { error } = await sb.from("admins").insert({ email, role, department_id: role === "dept" ? data.department : null });
    busy(false);
    if (error){ showErrors(form, { email: error.code === "23505" ? "Hierdie persoon is reeds 'n admin." : dbMessage(error) }); return; }
    toast("Admin bygevoeg — die nuwe regte geld sodra die persoon weer inteken.");
    await loadAll(); render();
  }

});

// Create / update an event from the Skep form. Returns { field: message } for
// anything wrong (nothing is saved then), or {} after saving.
async function saveEventForm(data){
  const errors = {};
  const allowed = adminDepartments();
  if (!allowed.length) return { title: "Jy is aan geen departement gekoppel nie." };
  const existing = state.editingId != null ? eventById(state.editingId) : null;
  if (existing && !canAdmin(existing)) return { title: "Jy mag nie hierdie geleentheid wysig nie." };

  // A disabled <select> (Departement-admin) isn't submitted, so fall back to their department.
  const department = allowed.some(d => d.id === data.department) ? data.department
                   : allowed.length === 1 ? allowed[0].id : null;
  if (!department) errors.department = "Kies 'n departement.";

  const title = cleanText(data.title, LIMITS.title);
  if (!title) errors.title = "Gee die geleentheid 'n naam.";
  else if (title.length < 3) errors.title = "Die naam is te kort (minstens 3 letters).";

  const today = toISO(TODAY);
  const date = String(data.date || "");
  if (!date) errors.date = "Kies 'n datum.";
  else if (!isValidISODate(date)) errors.date = "Dit is nie 'n geldige datum nie.";
  else if ((!existing || existing.date !== date) && date < today) errors.date = "Hierdie datum is al verby. Kies vandag of later.";
  else if (date > toISO(addDays(TODAY, 730))) errors.date = "Die datum is meer as twee jaar vooruit.";

  const start = String(data.start || ""), end = String(data.end || "");
  if (!isValidTime(start)) errors.start = "Kies 'n begintyd.";
  if (!isValidTime(end)) errors.end = "Kies 'n eindtyd.";
  if (isValidTime(start) && isValidTime(end)){
    const minutes = (hmToDecimal(end) - hmToDecimal(start)) * 60;
    if (minutes <= 0) errors.end = "Die einde moet ná die begin wees. (Geleenthede kan nie oor middernag loop nie.)";
    else if (minutes < 15) errors.end = "'n Geleentheid moet minstens 15 minute duur.";
    else if (!existing && date === today && hmToDecimal(start) < TODAY.getHours() + TODAY.getMinutes() / 60){
      errors.start = "Hierdie tyd is vandag al verby.";
    }
  }

  const venue = cleanText(data.venue, LIMITS.venue);
  const address = cleanText(data.address, LIMITS.address);
  const lat = Number(data.lat), lng = Number(data.lng);
  if (!(Number.isFinite(lat) && Number.isFinite(lng) && Math.abs(lat) <= 90 && Math.abs(lng) <= 180)){
    errors.address = "Kies die plek op die kaart (sleep die speld of soek 'n adres).";
  }
  const radius = Math.round(Number(data.radius));
  if (!(radius >= CONFIG.radiusMin && radius <= CONFIG.radiusMax)){
    errors.radius = `Die radius moet tussen ${CONFIG.radiusMin} en ${CONFIG.radiusMax} m wees.`;
  }
  const description = cleanMultiline(data.description, LIMITS.description);

  // People paste "quicket.co.za/..." without https:// — add it for them.
  let ticketUrl = cleanText(data.ticketUrl, LIMITS.url);
  if (ticketUrl && !/^[a-z]+:\/\//i.test(ticketUrl)) ticketUrl = "https://" + ticketUrl;
  if (ticketUrl && !isWebUrl(ticketUrl)) errors.ticketUrl = "Dit lyk nie soos 'n webadres nie (bv. https://www.quicket.co.za/...).";

  const duplicate = "Daar is reeds 'n geleentheid met hierdie naam op dié dag en tyd.";
  if (!errors.title && !errors.date && !errors.start && EVENTS.some(e => (!existing || e.id !== existing.id)
        && e.department === department && e.date === date && e.start === start && e.title.toLowerCase() === title.toLowerCase())){
    errors.title = duplicate;
  }
  if (Object.keys(errors).length) return errors;

  const row = {
    title, department_id: department, date, start_time: start, end_time: end, venue, description,
    ticket_url: ticketUrl || null, lat, lng, radius, address,
    audience_grades: (data.grades || []).filter(g => LEARNER_GRADES.includes(g)),
    audience_gender: GENDERS.includes(data.gender) ? data.gender : "all",
    audience_learners_only: data.learnersOnly === "on"
  };
  const { error } = existing
    ? await sb.from("events").update(row).eq("id", existing.id)
    : await sb.from("events").insert(row);
  if (error){
    if (error.code === "23505") return { title: duplicate };
    return { title: dbMessage(error) };
  }
  toast(existing ? "Veranderinge gestoor" : "Geleentheid geskep");
  if (!existing) goToDate(toDate(date));        // so the calendar shows it straight away
  state.editingId = null;
  await loadAll();
  return {};
}

function isNetworkError(err){
  const m = String((err && (err.message || err)) || "");
  return !navigator.onLine || /Failed to fetch|NetworkError|Load failed|network/i.test(m);
}
// Turn a Supabase/Postgres error into something a person can act on.
function dbMessage(err){
  const m = String((err && (err.message || err.error_description || err)) || "");
  const code = err && err.code;
  if (isNetworkError(err)) return "Geen internet nie. Probeer weer sodra jy aanlyn is.";
  if (/last_key_admin/.test(m)) return "Daar moet altyd minstens een Hoof-admin wees.";
  if (/grade_locked/.test(m)) return "Jy kan nie self jou naam, graad of geslag verander nie. Vra 'n Hoof-admin.";
  if (code === "23505") return "Dit bestaan reeds.";
  if (code === "23503") return "Dit word nog gebruik en kan nie geskrap word nie.";
  if (code === "23514") return "Een van die waardes word nie toegelaat nie.";
  if (code === "42501" || /row-level security|not_allowed|permission denied/i.test(m)) return "Jy mag dit nie doen nie.";
  if (/rate limit|too many/i.test(m)) return "Te veel versoeke. Wag 'n rukkie en probeer weer.";
  console.warn("Supabase:", m);
  return "Iets het fout gegaan. Probeer weer.";
}

// Send the e-mail code. Returns an error message, or "" when it was sent.
async function sendCode(draft, isSignup){
  if (!sb) return "Die app kon nie aan die bediener koppel nie.";
  const { error } = await sb.auth.signInWithOtp({
    email: draft.email,
    options: isSignup
      ? { shouldCreateUser: true, data: { name: draft.name, surname: draft.surname, grade: draft.grade, gender: draft.gender || "", popia: "true" } }
      : { shouldCreateUser: false }
  });
  if (!error){ state.auth.sentAt = Date.now(); return ""; }
  if (!isSignup && /signups? not allowed|user not found|otp_disabled/i.test(error.message + " " + (error.code || ""))){
    return "Hierdie e-posadres is nie geregistreer nie. Kies \"Registreer\" hierbo.";
  }
  if (/rate limit|security purposes|seconds/i.test(error.message)) return "Te veel kodes gevra. Wag 'n minuut (of langer) en probeer weer.";
  return dbMessage(error);
}

// Load everything this person may see. On failure (offline) fall back to the
// copy cached on this phone for the same account.
const CACHE_KEY = "garsie.cache";
// Supabase returns at most 1000 rows per request (found in the 2000-user
// load test: the export stopped at 1000). Lists that can grow past that are
// fetched page by page; the order makes the pages line up.
const PAGE_ROWS = 1000;
async function fetchAll(query){
  const rows = [];
  for (let from = 0; ; from += PAGE_ROWS){
    const { data, error } = await query().range(from, from + PAGE_ROWS - 1);
    if (error) return { data:null, error };
    rows.push(...data);
    if (data.length < PAGE_ROWS) return { data:rows, error:null };
  }
}

async function loadAll(){
  const u = state.session && state.session.user;
  if (!u) return;
  try {
    const [prof, role, depts, evs, sup, chk] = await Promise.all([
      sb.from("profiles").select("name,surname,grade,gender,notify_new,popia_accepted_at").eq("id", u.id).maybeSingle(),
      sb.rpc("my_role"),
      sb.from("departments").select("id,name,colour").order("name"),
      fetchAll(() => sb.from("events").select("*").order("date").order("start_time").order("id")),
      fetchAll(() => sb.from("supports").select("event_id").order("event_id")),
      fetchAll(() => sb.from("checkins").select("event_id,scanned_at,method,distance_m,flags").order("event_id"))
    ]);
    for (const r of [prof, role, depts, evs, sup, chk]) if (r.error) throw r.error;
    const myRole = (role.data || [])[0] || null;
    let admins = [], stats = [];
    if (myRole){
      const st = await fetchAll(() => sb.rpc("admin_event_stats").order("event_id"));
      if (st.error) throw st.error;
      stats = st.data || [];
      if (myRole.role === "key"){
        const ad = await sb.from("admins").select("email,role,department_id").order("email");
        if (ad.error) throw ad.error;
        admins = ad.data || [];
      }
    }
    applyData({ uid:u.id, email:u.email, profile:prof.data, role:myRole, departments:depts.data, events:evs.data,
                supports:sup.data, checkins:chk.data, admins, stats, savedAt:new Date().toISOString() });
    saveJSON(CACHE_KEY, { uid:u.id, email:u.email, profile:prof.data, role:myRole, departments:depts.data, events:evs.data,
                          supports:sup.data, checkins:chk.data, admins, stats, savedAt:new Date().toISOString() });
    state.offline = false;
  } catch (err){
    const cache = loadJSON(CACHE_KEY);
    if (cache && cache.uid === u.id){
      applyData(cache);
      if (!state.offline) toast(isNetworkError(err) ? "Geen internet nie — jy sien die data wat laas gestoor is." : dbMessage(err));
      state.offline = true;
    } else {
      state.fatal = isNetworkError(err) ? "Geen internet nie. Koppel aan die internet en probeer weer." : dbMessage(err);
    }
  }
  state.lastLoad = Date.now();
}
function applyData(d){
  state.needsProfile = !d.profile;
  state.needsConsent = !!d.profile && !d.profile.popia_accepted_at;
  state.user = d.profile ? {
    id: d.uid, email: (d.email || "").toLowerCase(), name: d.profile.name, surname: d.profile.surname,
    grade: d.profile.grade, gender: d.profile.gender || "", notifyNew: d.profile.notify_new !== false,
    role: d.role ? d.role.role : "user", department: d.role ? d.role.department_id : null
  } : null;
  DEPARTMENTS = d.departments || [];
  EVENTS = (d.events || []).map(rowToEvent);
  state.supported = new Set((d.supports || []).map(s => s.event_id));
  CHECKINS = {};
  (d.checkins || []).forEach(c => { CHECKINS[c.event_id] = { at:c.scanned_at, method:c.method, distance:c.distance_m, flags:c.flags || [] }; });
  ADMINS = (d.admins || []).map(a => ({ email:a.email, role:a.role, department:a.department_id }));
  STATS = {};
  (d.stats || []).forEach(x => { STATS[x.event_id] = { supporters:x.supporters, checkedIn:x.checked_in, suspicious:x.suspicious }; });
  if (state.preview && state.user) previewOverlay();     // fresh data, same pretend learner
}
async function refreshMyCheckins(){
  if (state.preview) return;
  const { data, error } = await fetchAll(() => sb.from("checkins").select("event_id,scanned_at,method,distance_m,flags").order("event_id"));
  if (error) return;
  CHECKINS = {};
  data.forEach(c => { CHECKINS[c.event_id] = { at:c.scanned_at, method:c.method, distance:c.distance_m, flags:c.flags || [] }; });
  const cache = loadJSON(CACHE_KEY);
  if (cache && state.user && cache.uid === state.user.id) saveJSON(CACHE_KEY, { ...cache, checkins:data });
}

// Run a change against the database, then reload and redraw.
async function dbAction(run, successMessage){
  const { error } = await run();
  if (error){ toast(dbMessage(error)); return false; }
  if (successMessage) toast(successMessage);
  await loadAll(); render();
  return true;
}

// "Ek ondersteun": update the screen straight away, undo if the server says no.
async function toggleSupport(e){
  if (previewBlocks()) return;
  const on = !state.supported.has(e.id);
  on ? state.supported.add(e.id) : state.supported.delete(e.id);
  render();
  const { error } = on
    ? await sb.from("supports").insert({ event_id:e.id })
    : await sb.from("supports").delete().eq("event_id", e.id).eq("user_id", state.user.id);
  if (error && error.code !== "23505"){
    on ? state.supported.delete(e.id) : state.supported.add(e.id);
    toast(dbMessage(error));
    render();
  }
}

/* ---- "Skakel kennisgewings aan" --------------------------------------------
   Straight after signing in (and after the home-screen sheet), ask for
   notifications and say why. The phone's own "Allow" question may only come
   from a tap, so our sheet asks first and its button triggers it.
   "Nie nou nie" asks again after 3 days. iPhone in Safari (not on the home
   screen) can't get notifications at all: the home-screen sheet covers that. */
const PUSH_ASKED_KEY = "garsie.pushAsked";
const PUSH_OFF_KEY = "garsie.pushOff";          // the uid that switched them off on purpose
const PUSH_ASK_AGAIN_MS = 3 * 24 * 60 * 60 * 1000;

function maybeOfferPush(){
  if (state.preview || !state.user || state.needsConsent || state.pushOffered) return;
  if (document.getElementById("install-help") || document.getElementById("push-ask")) return;
  const supported = "Notification" in window && "PushManager" in window && "serviceWorker" in navigator && window.isSecureContext;
  if (!supported) return;
  // Already allowed (e.g. someone else signed out on this phone): switch on quietly.
  if (Notification.permission === "granted"){ state.pushOffered = true; checkPush(); return; }
  if (Notification.permission !== "default" || loadJSON(PUSH_OFF_KEY) === state.user.id) return;
  const asked = loadJSON(PUSH_ASKED_KEY);
  if (asked && Date.now() - asked < PUSH_ASK_AGAIN_MS) return;
  state.pushOffered = true;
  setTimeout(openPushAsk, 700);
}

      <div style="font-size:40px;text-align:center;line-height:1">🔔</div>
      <h2 style="font-size:21px;margin:10px 0 6px;text-align:center">Moenie iets mis nie</h2>
      <p style="margin:0 0 14px;text-align:center;color:var(--muted)">Met kennisgewings bly jy op hoogte van alles wat by die skool gebeur.</p>
      <ul style="list-style:none;padding:0;margin:0 0 6px">
        ${why("⚠️", "Hoor <b>dadelik</b> of 'n geleentheid <b>verskuif of gekanselleer</b> is, voordat jy verniet ry.")}
        ${why("⏰", "Kry 'n <b>herinnering 'n uur voor</b> 'n geleentheid wat jy ondersteun.")}
        ${why("🆕", "Hoor <b>eerste</b> van nuwe geleenthede vir jou graad.")}
      </ul>
      <p style="margin:0 0 12px;font-size:13px;color:var(--muted);text-align:center">Jou foon vra dan of die app kennisgewings mag stuur: druk <b>Allow</b>.</p>
      <button class="btn-primary" data-yes>Skakel kennisgewings aan</button>
      <button class="btn-link" data-close style="width:100%;margin-top:6px;color:var(--muted)">Nie nou nie</button>
    </div>`;
  const close = () => el.remove();
  el.addEventListener("click", async ev => {
    if (ev.target.closest("[data-yes]")){
      await enablePush();
      if (state.push.status === "on") close();
      else if (state.push.status === "blocked"){ close(); toast("Kennisgewings is geblokkeer. Skakel dit in jou foon se instellings aan."); }
      return;
    }
    if (ev.target === el || ev.target.closest("[data-close]")){ saveJSON(PUSH_ASKED_KEY, Date.now()); close(); }
  });
  document.body.appendChild(el);
}

function base64UrlBytes(s){
  const b = atob((s + "=".repeat((4 - s.length % 4) % 4)).replace(/-/g, "+").replace(/_/g, "/"));
  return Uint8Array.from(b, c => c.charCodeAt(0));
}
// The service worker, or null if there isn't one (e.g. not https).
function swReady(){
  if (!("serviceWorker" in navigator) || !window.isSecureContext) return Promise.resolve(null);
  return Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 4000))]);
}
async function currentSubscription(){
  const reg = await swReady();
  return reg && reg.pushManager ? reg.pushManager.getSubscription() : null;
}
function saveSubscription(sub){
  const j = sub.toJSON();
  return sb.rpc("save_push_subscription", { p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth });
}

// This phone's push subscription, made if there is none yet.
async function subscribeThisDevice(){
  const reg = await swReady();
  if (!reg) throw new Error("no service worker");
  return (await reg.pushManager.getSubscription()) ||
    reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:base64UrlBytes(VAPID_PUBLIC_KEY) });
}

async function checkPush(){
  const p = state.push;
  p.status = "checking";
  try {
    if (!("Notification" in window) || !("PushManager" in window) || !("serviceWorker" in navigator)){
      p.status = isIos() && !isStandalone() ? "install" : "unsupported";
    } else if (Notification.permission === "denied"){
      p.status = "blocked";
    } else {
      let sub = await currentSubscription();
      // Allowed before but not subscribed (e.g. after a sign-out): subscribe again,
      // unless this person switched notifications off themselves.
      if (!sub && Notification.permission === "granted" && loadJSON(PUSH_OFF_KEY) !== (state.user && state.user.id)){
        sub = await subscribeThisDevice().catch(() => null);
      }
      p.status = sub && Notification.permission === "granted" ? "on" : "off";
      // Re-save every time: keeps this phone linked to whoever is signed in now.
      if (p.status === "on") saveSubscription(sub).then(() => {}, () => {});
    }
  } catch { p.status = "unsupported"; }
  renderPushCard();
}

function pushCardHtml(){
  const p = state.push;
  if (p.status === "unknown"){ setTimeout(checkPush, 0); return ""; }
  if (p.status === "checking") return "";
  const box = inner => `<div style="background:rgba(255,255,255,.08);border-radius:16px;padding:12px 14px;margin-bottom:12px;color:#dfe8ef;font-size:13px;line-height:1.4">${inner}</div>`;
  const btn = (action, label, filled) => `<button data-action="${action}" ${p.busy ? "disabled" : ""}
      style="border-radius:16px;padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;
             ${filled ? "background:var(--brand);color:#fff;border:none" : "background:none;color:#fff;border:.5px solid rgba(173,205,226,.35)"}">${label}</button>`;
  switch (p.status){
    case "unsupported":
      return box("Hierdie blaaier kan nie kennisgewings wys nie.");
    case "install":
      return box(`<b style="color:#fff">Wil jy kennisgewings kry?</b><br>
        Op 'n iPhone moet die app eers op jou tuisskerm wees: druk onderaan op <b>···</b> en dan <b>Share</b> (by ouer iPhones: die vierkant met die pyltjie),
        dan <b>Add to Home Screen</b>. Maak die app van daar af oop en kom terug na hierdie blad.
        <div style="margin-top:8px">${btn("install-help", "Wys my hoe", true)}</div>`);
    case "blocked":
      return box("Kennisgewings is geblokkeer. Skakel dit in jou foon se instellings vir hierdie app aan, en maak die app weer oop.");
    case "off":
      return box(`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <span>Kry 'n boodskap wanneer 'n geleentheid wat jy ondersteun, verskuif of gekanselleer word of binnekort begin.</span>
        ${btn("push-on", p.busy ? "Wag…" : "Skakel kennisgewings aan", true)}</div>`);
    case "on": {
      const wantNew = !!(state.user && state.user.notifyNew);
      return box(`<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap">
        <span>🔔 Kennisgewings is op hierdie toestel aan.</span>
        <span style="display:flex;gap:6px;flex-wrap:wrap">${btn("push-test", "Stuur toets")}${btn("push-off", "Skakel af")}</span></div>
        <button data-action="push-new" role="switch" aria-checked="${wantNew}" ${p.busy ? "disabled" : ""}
          style="margin-top:10px;display:flex;align-items:center;gap:10px;background:none;border:none;color:#dfe8ef;font-size:13px;padding:0;cursor:pointer;text-align:left">
          <span style="width:36px;height:22px;border-radius:11px;flex:none;position:relative;background:${wantNew ? "var(--brand)" : "rgba(173,205,226,.35)"}">
            <span style="position:absolute;top:2px;${wantNew ? "right" : "left"}:2px;width:18px;height:18px;border-radius:50%;background:#fff"></span></span>
          Ook as daar 'n nuwe geleentheid vir jou is
        </button>`);
    }
  }
  return "";
}
function renderPushCard(){
  const el = document.getElementById("push-card");
  if (el) el.innerHTML = pushCardHtml();
}

async function enablePush(){
  if (previewBlocks()) return;
  const p = state.push;
  if (p.busy) return;
  p.busy = true; renderPushCard();
  try {
    // Must be the first thing after the tap, or iPhone ignores it.
    const perm = await Notification.requestPermission();
    if (perm !== "granted"){ p.status = perm === "denied" ? "blocked" : "off"; return; }
    const sub = await subscribeThisDevice();
    const { error } = await saveSubscription(sub);
    if (error) throw error;
    p.status = "on";
    saveJSON(PUSH_OFF_KEY, null);
    toast("Kennisgewings is aan.");
  } catch (err){
    toast(isNetworkError(err) ? dbMessage(err) : "Kon nie kennisgewings aanskakel nie. Probeer weer.");
  } finally { p.busy = false; renderPushCard(); }
}

// Remove this phone from the server, then from the browser.
async function forgetThisDevice(){
  const sub = await currentSubscription();
  if (!sub) return;
  try { await sb.rpc("remove_push_subscription", { p_endpoint:sub.endpoint }); } catch {}
  await sub.unsubscribe();       // if the server call failed, the next send finds it gone and cleans up
}
async function disablePush(){
  if (previewBlocks()) return;
  const p = state.push;
  if (p.busy) return;
  p.busy = true; renderPushCard();
  try { await forgetThisDevice(); p.status = "off"; saveJSON(PUSH_OFF_KEY, state.user && state.user.id); toast("Kennisgewings is af."); }
  catch { toast("Kon nie afskakel nie. Probeer weer."); }
  finally { p.busy = false; renderPushCard(); }
}

async function testPush(){
  if (previewBlocks()) return;
  const { data, error } = await sb.rpc("push_test");
  if (error) return toast(dbMessage(error));
  if (!data){ state.push.status = "off"; renderPushCard(); return toast("Hierdie toestel is nie meer geregistreer nie. Skakel kennisgewings weer aan."); }
  toast("Toets gestuur. Dit behoort binne 'n paar sekondes op te daag.");
}

async function toggleNotifyNew(){
  if (previewBlocks()) return;
  if (!state.user || state.push.busy) return;
  const want = !state.user.notifyNew;
  state.user.notifyNew = want; renderPushCard();
  const { error } = await sb.from("profiles").update({ notify_new:want }).eq("id", state.user.id);
  if (error){ state.user.notifyNew = !want; renderPushCard(); toast(dbMessage(error)); }
}

// A notification (or a shared link) can open one event: #geleentheid=<id>.
function takeEventFromUrl(){
  const m = location.hash.match(/geleentheid=(\d+)/);
  if (!m) return;
  state.pendingEventId = Number(m[1]);
  history.replaceState(null, "", location.pathname + location.search);
}
async function openPendingEvent(){
  if (state.pendingEventId == null || !state.user) return;
  const id = state.pendingEventId;
  state.pendingEventId = null;
  if (!eventById(id) && navigator.onLine) await loadAll();     // e.g. a brand-new event
  if (!eventById(id)) return toast("Hierdie geleentheid bestaan nie meer nie.");
  Object.assign(state, { openEventId:id, qrEventId:null, editingId:null });
  render();
}
if ("serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("message", ev => {
    if (ev.data && ev.data.type === "open" && ev.data.hash) location.hash = ev.data.hash;
  });
}

/* "Skrap my rekening" (Myne). Deletes the account and everything linked to
   it on the server (delete_my_account), then signs out on this phone. */
function openDeleteAccount(){
  if (previewBlocks()) return;
  if (document.getElementById("delete-account")) return;
  const el = document.createElement("div");
  el.id = "delete-account";
  el.setAttribute("role", "dialog");
  el.setAttribute("aria-modal", "true");
  el.setAttribute("aria-label", "Skrap my rekening");
  el.style.cssText = "position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:16px";
  el.innerHTML = `<div style="background:var(--surface);color:var(--shadow-ink);border-radius:20px;max-width:480px;width:100%;padding:20px;font-size:14px;line-height:1.5">
      <h2 style="font-size:20px;margin:0 0 8px">Skrap jou rekening?</h2>
      <p style="margin:0 0 8px">Dit vee <b>alles</b> van jou uit: jou profiel, watter geleenthede jy ondersteun, jou aanmeldings en jou kennisgewings.</p>
      <p style="margin:0 0 14px;color:var(--muted)">Dit kan nie ongedaan gemaak word nie. Jy kan later weer registreer, maar as 'n nuwe gebruiker.</p>
      <button class="btn-primary" data-yes>Ja, skrap my rekening</button>
      <button class="btn-link" data-close style="width:100%;margin-top:6px">Kanselleer</button>
    </div>`;
  el.addEventListener("click", async ev => {
    const yes = ev.target.closest("[data-yes]");
    if (yes){
      if (yes.disabled) return;
      yes.disabled = true; yes.textContent = "Besig…";
      const err = await deleteAccount();
      if (err){ yes.disabled = false; yes.textContent = "Ja, skrap my rekening"; toast(err); return; }
      el.remove();
      toast("Jou rekening is geskrap.");
      return;
    }
    if (ev.target === el || ev.target.closest("[data-close]")) el.remove();
  });
  document.body.appendChild(el);
  el.querySelector("[data-close]").focus({ preventScroll:true });
}
// Returns an error message, or "" when the account is gone.
async function deleteAccount(){
  if (!navigator.onLine) return "Jy het internet nodig om jou rekening te skrap.";
  const uid = state.user && state.user.id;
  try { await forgetThisDevice(); } catch {}
  const { error } = await sb.rpc("delete_my_account");
  if (error) return dbMessage(error);
  OUTBOX = OUTBOX.filter(o => o.uid !== uid); saveOutbox();     // nothing left to send for them
  await signOut();
  return "";
}

async function signOut(){
  if (state.preview) endPreview();
  stopLocation();
  // Don't let the next person on this phone get this person's notifications.
  try { await forgetThisDevice(); } catch {}
  state.push = { status:"unknown", busy:false };
  state.pushOffered = false; state.installOffered = false;
  try { if (sb) await sb.auth.signOut({ scope:"local" }); } catch {}
  saveJSON(CACHE_KEY, null);                    // don't leave data behind on a shared phone
  Object.assign(state, { session:null, user:null, needsProfile:false, offline:false, mapEventId:null,
                         tab:"calendar", openEventId:null, editingId:null, qrEventId:null, settingsOpen:false, settingsPage:null, preview:null,
                         auth:{ mode:"signin", step:"details", draft:{} } });
  DEPARTMENTS = []; EVENTS = []; ADMINS = []; CHECKINS = {}; STATS = {}; state.supported = new Set();
  render();
}

async function init(){
  // #animasie: just the loading animation, on a loop (for checking it).
  if (location.hash === "#animasie"){ state.loading = true; render(); return; }
  takeOAuthError();
  checkGoogle();
  takeScanFromUrl();
  takeEventFromUrl();
  if (!sb){
    state.fatal = "Die app kon nie laai nie. Kyk of jy aan die internet gekoppel is en probeer weer.";
    render(); return;
  }
  const { data } = await sb.auth.getSession();
  state.session = data.session;
  if (state.session) await loadAll();
  await loaderMinimum();
  state.loading = false;
  render();
  if (state.user){ processPendingScan(); openPendingEvent(); syncOutbox(); }

  sb.auth.onAuthStateChange((event, session) => {
    state.session = session;
    if (event === "SIGNED_OUT" && state.user) signOut();
  });
}

render();          // loading screen while we check the session
init();

// A QR link opened while the app is already open.
window.addEventListener("hashchange", () => {
  takeScanFromUrl();
  takeEventFromUrl();
  if (state.user){ processPendingScan(); openPendingEvent(); }
  else render();               // shows "Teken in om aan te meld" on the sign-in screen
});

// Back online: send waiting check-ins and refresh the data.
async function onConnectionChange(){
  const { sent } = await syncOutbox();
  if (sent.length) toast(`${sent.length} aanmelding${sent.length > 1 ? "s" : ""} gestuur`);
  const mine = state.user && [...sent].reverse().find(x => x.item.uid === state.user.id);
  if (mine) state.scan = { status:mine.outcome.status, message:mine.outcome.message };
  const card = document.getElementById("scan-card");
  if (card) card.innerHTML = scanCardHtml();
  if (navigator.onLine && state.offline && state.user) refreshQuietly();
}
window.addEventListener("online", onConnectionChange);
window.addEventListener("offline", onConnectionChange);

// Coming back to the app after a while: fetch fresh data, but never while
// someone is typing in a form.
async function refreshQuietly(){
  if (!state.user || document.querySelector("form:focus-within") || state.qrEventId != null) return;
  await loadAll();
  if (!document.querySelector("form:focus-within")) render();
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && Date.now() - (state.lastLoad || 0) > 60000) refreshQuietly();
});

// Offline support: sw.js keeps a copy of the app on the phone.
if ("serviceWorker" in navigator && window.isSecureContext){
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
