<!DOCTYPE html>
<!--
===============================================================================
  GARSIE ARMY — supporter app for Hoërskool Garsfontein
  Clickable prototype / handoff spec  ·  v1.0  ·  2026-09-21
===============================================================================

  WHAT THIS IS
  A single-file, dependency-free prototype of the supporter app. It exists to
  pin down the screens, the flows and the data model. It is NOT production
  code — there is no backend, no auth and no build step. Open it in a browser
  (desktop or phone) and click through it.

  THE IDEA
  Every school event — sport and cultural — in one calendar, with a link out
  to the ticket page. Ticketing, capacity and gate scanning stay on Quicket;
  this app is the supporter-facing front end on top of it.

  SIGN IN
  Before the tabs, an Aanmeld screen: Registreer (e-pos, naam, van, graad)
  or Teken in (e-pos), then a one-time code. Built for Supabase magic OTP
  but not connected yet — it accepts anything. Search "screenAuth".

  ROLES (picked on the sign-in screen in this prototype)
    Gebruiker          supporter: the four tabs below
    Departement-admin  "Skep" tab: create / edit / export events of ONE department
    Hoof-admin         + "Bestuur" tab: departments and who is admin of what,
                       and can create / edit / export events of ANY department
  Admin tabs sit in front of Kalender, Soek and Myne. Admins don't get Kaart:
  checking in is for supporters. Search "ROLES & PERMISSIONS".

  QR CHECK-IN
  Admins show a live QR (changes every 30 s) or print a fixed one. Scans are
  saved on the phone and sent when online. Forwarded codes and wrong
  locations land in "Verdagte aanmeldings" in the export. Search "6b2".

  AUDIENCE ("Wie mag kom?")
  An event can be limited to some grades, to boys or girls, and/or to
  learners only. Supporters outside the audience don't see the event at all;
  admins always see the events they manage. Search "AUDIENCE".
  TODO: in production the role comes from the admins table (managed in
  Bestuur), never from a picker the user controls.

  THE FOUR TABS
    Kalender  Real calendar on today's date. Week view (days top to bottom,
              hours left to right) or Maand view (grid; tap a day for its
              events). "Vandag" button; tap the title to jump to a date.
    Kaart     Real map (OpenStreetMap) with each event's pin and check-in
              circle. "Meld aan" unlocks when your live location is inside
              the circle; check-ins go into the Excel export. The QR
              button scans an event's QR code to check in — works offline.
    Soek      Search and filter by department.
    Myne      Events the user has tapped "Ek ondersteun" on.

  BACKEND
  Supabase (project "garsie-army"). Schema, security rules and the server-side
  functions are in supabase/migrations/ in this repo. The app talks to it only
  through section 8 ("SUPABASE") at the bottom of this script.

  WHAT IS REAL vs FAKE IN THIS FILE
    Real   layout, navigation, week maths, search, filtering, support toggle,
           map, live location, address search, location check-in
    Real   sign-in with an e-mailed code, events, roles, "Ek ondersteun",
           check-ins, QR codes and the Excel export — all through Supabase
    Fake   nothing left; the September 2026 events are sample data in the database
           the "server" (QR checks, sync) runs in this browser — see QR check-in
           ticket links point at quicket.co.za, not real event pages

  BUILD NOTES FOR THE DEVELOPER
  Search this file for "TODO:" — each one marks an integration point.
  Summary of what has to be built for real:
    1. Events API (shape documented at the EVENTS array below).
    2. An admin screen where a coach/organiser submits an event and a staff
       member approves it. This is the part that decides whether the app
       lives or dies — a calendar with stale fixtures gets abandoned.
    3. Auth + per-user "Ek ondersteun" list, persisted server-side.
    4. Push notifications for changes (a rained-out fixture is the main case).
    5. POPIA: if learner names/grades are stored, that is personal data of
       minors. Get the school's sign-off on what is collected and retained
       BEFORE writing that table.

  SUGGESTED STACK (not prescriptive)
  React Native or Flutter if it must be in the app stores; a PWA is cheaper
  and installs to the home screen, which is enough for most school use.
  Whatever is chosen, keep events in one source of truth so the school's
  website and this app cannot disagree.

  LANGUAGE
  All UI copy is Afrikaans. Code comments are English. If the app ships
  bilingual, pull the strings into a locale file rather than hard-coding —
  see the STRINGS note further down.

  BRANDING
  --brand (#C0262D) is a placeholder red. Replace with the school's official
  colours and add the crest before this is shown to anyone at the school.
===============================================================================
-->

<style>
/* ---------------------------------------------------------------------------
   THEME TOKENS
   The whole app is light/dark aware: it follows the device setting, and the
   sun/moon button (top-right) overrides it and is remembered. Use the
   --surface / --surface-2 / --hairline / --shadow-ink / --muted tokens for
   any new UI instead of hard-coded greys. Deliberately NOT themed: the map
   drawing, the QR screen and the Myne cards (they are always dark).
--------------------------------------------------------------------------- */
:root{
  --brand:#C0262D;          /* primary — school red (PLACEHOLDER) */
  --brand-ink:#8e1d24;      /* text on light red */
  --brand-wash:#fde4e4;     /* light red fill */
  --myne-bg:#1f2a44;        /* "Myne" tab background */

  --page:#ececef; --ink:#1d1d1f; --muted:#6e6e73;
  --btn:#fff; --btn-border:#d2d2d7;

  /* App content surfaces — theme-aware */
  --surface:#fff; --surface-2:#f2f2f4; --hairline:#e5e5ea; --shadow-ink:#111;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --page:#141416; --ink:#f2f2f7; --muted:#a1a1a6;
    --btn:#232326; --btn-border:#3a3a3e;
    --surface:#1c1c1e; --surface-2:#2c2c2e; --hairline:#38383a; --shadow-ink:#f2f2f7;
    --brand-wash:#4a1f23;
  }
}
:root[data-theme="dark"]{
  --page:#141416; --ink:#f2f2f7; --muted:#a1a1a6;

  --brand-wash:#4a1f23;

.map{position:absolute;inset:0;isolation:isolate;background:#e5e3df}

<script>
"use strict";

/* ===========================================================================
   1. CONFIG
   Everything a developer would want to change first lives here.
=========================================================================== */
const CONFIG = {
  school: "Hoërskool Garsfontein",

  // Visible hour range in the week view and the column width per hour.
  // 06:00–22:00 covers early practices through evening concerts.
  dayStartHour: 6,
  dayEndHour:   22,
  hourWidthPx:  56,
  rowHeightPx:  54,

  // Where the horizontal scroll lands when the calendar opens.
  // Most school events are afternoon, so don't start the user at 06:00.
  initialScrollHour: 13,

let TODAY = new Date();            // refreshed every minute (see the clock at the bottom)

function toDate(iso){                       // "2026-06-16" -> Date (local midnight)
  const [y,m,d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function toISO(date){                       // Date -> "2026-06-16"
  const p = n => String(n).padStart(2,"0");
  return `${date.getFullYear()}-${p(date.getMonth()+1)}-${p(date.getDate())}`;
}
function addDays(date, n){
  const d = new Date(date); d.setDate(d.getDate() + n); return d;
}
function mondayOf(date){                    // week starts Monday (SA convention)
  const d = new Date(date);
  const shift = (d.getDay() + 6) % 7;       // Sun=0 -> 6, Mon=1 -> 0
  return addDays(d, -shift);
}
function hmToDecimal(hm){                   // "14:30" -> 14.5
  const [h,m] = hm.split(":").map(Number);
  return h + m / 60;
}
function sameDay(a, b){ return toISO(a) === toISO(b); }

// Events on a given day, earliest first.
function eventsOn(date){
  const iso = toISO(date);
  return visibleEvents().filter(e => e.date === iso && passesFilter(e))
               .sort((a,b) => hmToDecimal(a.start) - hmToDecimal(b.start));
}
function eventById(id){ return EVENTS.find(e => e.id === id); }

// Department of an event, with the tints the UI needs derived from its one colour.
function deptById(id){
  const found = DEPARTMENTS.find(d => d.id === id) || { id, name:"Onbekend", colour:"#8e8e93" };
  const d = { ...found, colour: isHexColour(found.colour) ? found.colour : "#8e8e93" };
  return { ...d,
    wash: `color-mix(in srgb, ${d.colour} 14%, white)`,   // block / badge fill
    ink:  `color-mix(in srgb, ${d.colour} 72%, black)`,   // text on the wash
    deep: `color-mix(in srgb, ${d.colour} 70%, black)` }; // Myne card background
}
function deptOf(e){ return deptById(e.department); }

/* ---------------------------------------------------------------------------
   AUDIENCE ("Wie mag kom?")
   event.audience = { grades: ["Graad 11", ...]  (empty = every grade),
                      gender: "all" | "Seun" | "Meisie",
                      learnersOnly: true|false }   (picking grades implies learners)
   Missing audience = everyone. A person fits when their profile matches all
   the rules; an unknown grade or gender does NOT fit a rule that needs it.
   TODO: filter server-side too, or the hidden events are still in the API.
--------------------------------------------------------------------------- */
const LEARNER_GRADES = ["Graad 8","Graad 9","Graad 10","Graad 11","Graad 12"];
const GENDERS = ["Seun","Meisie"];

function hasAudience(e){
  const a = e.audience;
  return !!a && (a.learnersOnly || (a.grades || []).length > 0 || (a.gender && a.gender !== "all"));
}
function fitsAudience(e, person){
  const a = e.audience;
  if (!hasAudience(e)) return true;
  if (!person) return false;
  const grades = a.grades || [];
  if ((a.learnersOnly || grades.length) && !LEARNER_GRADES.includes(person.grade)) return false;
  if (grades.length && !grades.includes(person.grade)) return false;
  if (a.gender && a.gender !== "all" && person.gender !== a.gender) return false;
  return true;
}
// What the signed-in user may see: events they manage, plus events they fit.
function isForUser(e){ return canAdmin(e) || fitsAudience(e, state.user); }
function visibleEvents(){ return EVENTS.filter(isForUser); }

// "Graad 11 & 12 · Meisies" — or "" when the event is for everyone.
function audienceLabel(e){
  if (!hasAudience(e)) return "";
  const a = e.audience, parts = [];
  const grades = (a.grades || []).map(g => g.replace("Graad ", ""));
  if (grades.length) parts.push(`Graad ${grades.length > 1 ? grades.slice(0, -1).join(", ") + " & " + grades[grades.length - 1] : grades[0]}`);
  else if (a.learnersOnly) parts.push("Net leerders");
  if (a.gender === "Seun") parts.push("Seuns");
  if (a.gender === "Meisie") parts.push("Meisies");
  return parts.join(" · ");
}

// Shared department filter (state.filter is "Alles" or a department id).
function passesFilter(e){ return state.filter === "Alles" || e.department === state.filter; }

/* --- 6·. Input checks --------------------------------------------------------
   Every form goes through these. The rule of thumb: clean up what's obviously
   meant (extra spaces, capitals in an email, a missing https://), and for
   everything else show a clear Afrikaans message next to the field instead of
   quietly guessing. Forms use `novalidate` so the browser's own bubbles
   (English, different per browser) never appear.
   TODO: the server must repeat these checks — the browser can be bypassed.
------------------------------------------------------------------------- */
const LIMITS = { name:40, email:254, title:80, venue:80, address:200, description:600, deptName:30, search:100, url:500 };

function cleanText(v, max){        // one line: no control characters, single spaces, trimmed
  return String(v ?? "").replace(/[\u0000-\u001F\u007F]/g, " ").replace(/\s+/g, " ").trim().slice(0, max);
}
function cleanMultiline(v, max){   // keeps line breaks, max one empty line in a row
  return String(v ?? "").replace(/\r\n?/g, "\n").replace(/[\u0000-\u0009\u000B-\u001F\u007F]/g, "")
    .replace(/[ \t]+/g, " ").replace(/ ?\n ?/g, "\n").replace(/\n{3,}/g, "\n\n").trim().slice(0, max);
}
function normEmail(v){ return String(v ?? "").trim().toLowerCase(); }
function isEmail(v){ return v.length <= LIMITS.email && /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)*\.[a-z]{2,}$/i.test(v); }
function isName(v){ return /^\p{L}[\p{L}\p{M}'’\- ]*$/u.test(v); }
function isDeptName(v){ return /^[\p{L}\p{N}][\p{L}\p{N}\p{M} &'’\-\/().]*$/u.test(v); }
function isValidISODate(s){ return /^\d{4}-\d{2}-\d{2}$/.test(s) && toISO(toDate(s)) === s; }
function isValidTime(s){ return /^([01]\d|2[0-3]):[0-5]\d$/.test(s); }
function isWebUrl(s){
  try { const u = new URL(s); return (u.protocol === "https:" || u.protocol === "http:") && /\.[a-z]{2,}$/i.test(u.hostname); }
  catch { return false; }
}
function isHexColour(c){ return /^#[0-9a-f]{6}$/i.test(String(c)); }
function luminance(hex){           // WCAG relative luminance, 0 (black) … 1 (white)
  const [r, g, b] = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16) / 255)
    .map(c => c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4);
  return 0.2126 * r + 0.7152 * g + 0.0722 * b;
}
// Department colours show as pins, blocks and chips on white — too light and they vanish.
function colourProblem(hex){
  if (!isHexColour(hex)) return "Kies 'n kleur.";
  if (luminance(hex) > 0.7) return "Hierdie kleur is te lig — dit sal op 'n wit agtergrond verdwyn. Kies 'n donkerder kleur.";
  return "";
}

// Show messages under the fields that are wrong; returns true when there are none.
function showErrors(form, errors){
  form.querySelectorAll(".field-error").forEach(n => n.remove());
  form.querySelectorAll(".invalid").forEach(n => n.classList.remove("invalid"));
  let first = null;
  for (const [name, message] of Object.entries(errors)){
    let el = form.elements[name];
    if (el && !el.tagName && el.length) el = el[0];          // radio group
    const field = (el && el.closest(".field")) || form;
    field.classList.add("invalid");
    field.insertAdjacentHTML("beforeend", `<div class="field-error" role="alert">${esc(message)}</div>`);
    if (!first) first = (el && el.type !== "hidden") ? el : field;
  }
  if (first){
    first.scrollIntoView({ block:"center", behavior:"smooth" });
    if (first.focus) first.focus({ preventScroll:true });
  }
  return !first;
}
function clearFieldError(el){
  const field = el.closest && el.closest(".field.invalid");
  if (!field) return;
  field.classList.remove("invalid");
  field.querySelectorAll(".field-error").forEach(n => n.remove());
}

      <button class="btn-primary" data-close style="margin-top:14px">Maak toe</button>
    </div>`;
  const close = () => { el.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = ev => { if (ev.key === "Escape") close(); };
  el.addEventListener("click", ev => { if (ev.target === el || ev.target.closest("[data-close]")) close(); });
  document.addEventListener("keydown", onKey);
  document.body.appendChild(el);
  el.querySelector("[data-close]").focus({ preventScroll:true });
}

// Checks the profile fields; returns [clean values, errors].
function checkProfile(data){
  const v = {
    name: cleanText(data.name, LIMITS.name),
    surname: cleanText(data.surname, LIMITS.name),
    grade: GRADES.includes(data.grade) ? data.grade : ""
  };
  v.gender = LEARNER_GRADES.includes(v.grade) && GENDERS.includes(data.gender) ? data.gender : "";
  const errors = {};
  if (!v.name) errors.name = "Tik jou naam in.";
  else if (!isName(v.name)) errors.name = "Net letters, spasies, - en ' asseblief.";
  if (!v.surname) errors.surname = "Tik jou van in.";
  else if (!isName(v.surname)) errors.surname = "Net letters, spasies, - en ' asseblief.";
  if (!v.grade) errors.grade = "Kies jou graad.";
  else if (LEARNER_GRADES.includes(v.grade) && !v.gender) errors.gender = "Kies seun of meisie.";
  return [v, errors];
}

/* --- 6a. Kalender -------------------------------------------------------
   A real calendar on today's date, with two views:
     Week   days top-to-bottom, hours left-to-right (scroll sideways) — a day
            view turned on its side. The hour range grows to fit any event
            outside 06:00–22:00.
     Maand  a month grid; tap a day to see its events underneath.
   "Vandag" jumps back to today; tap the title to jump to any date.
   state.selectedDate is the anchor: switching views keeps the same day.
------------------------------------------------------------------------- */
const DAY_LONG = ["Maandag","Dinsdag","Woensdag","Donderdag","Vrydag","Saterdag","Sondag"];

// Hours shown in the week view: 06–22, stretched to fit this week's events.
function weekHours(){
  let H0 = CONFIG.dayStartHour, H1 = CONFIG.dayEndHour;
  for (let i = 0; i < 7; i++){
    eventsOn(addDays(state.weekStart, i)).forEach(e => {
      H0 = Math.min(H0, Math.floor(hmToDecimal(e.start)));
      H1 = Math.max(H1, Math.ceil(hmToDecimal(e.end)));
    });
  }
  return [H0, Math.min(24, H1)];
}
// Hour column width. Never narrower than CONFIG.hourWidthPx (phones scroll
// sideways), but on wide screens it grows so the whole day fits without scrolling.
function hourWidth(hours){
  return Math.max(CONFIG.hourWidthPx, Math.floor((screenEl.clientWidth - 48) / hours));
}

function shortDate(d, withYear){ return `${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}${withYear ? " " + d.getFullYear() : ""}`; }
function calendarTitle(){
  const thisYear = TODAY.getFullYear();
  if (state.calView === "month"){
    const m = state.monthStart;
    return `${MONTHS[m.getMonth()]}${m.getFullYear() !== thisYear ? " " + m.getFullYear() : ""}`;
  }
  const a = state.weekStart, b = addDays(a, 6);
  const withYear = a.getFullYear() !== thisYear || b.getFullYear() !== thisYear;
  if (a.getMonth() === b.getMonth()) return `${a.getDate()} – ${shortDate(b, withYear)}`;
  return `${shortDate(a, withYear && a.getFullYear() !== b.getFullYear())} – ${shortDate(b, withYear)}`;
}

// Move the calendar to a date, keeping week, month and the picked day in step.
function goToDate(date){
  state.selectedDate = toISO(date);
  state.weekStart = mondayOf(date);
  state.monthStart = new Date(date.getFullYear(), date.getMonth(), 1);
  state.scrollLeft = null;
}

// Readable text colour on top of a department colour (white on dark, black on light).
function readableOn(colour){ return isHexColour(colour) && luminance(colour) > 0.45 ? "#111" : "#fff"; }

// Department filter chips, shared by Kalender, Soek and Myne so the choice
// carries across tabs. New departments show up here automatically.
function filterChips(onDark = false){
  const chip = (value, label, colour) => {
    const active = state.filter === value;
    const text = readableOn(colour);
    const style = active ? `background:${colour};border-color:${colour};color:${text}` : "";
    return `<button class="chip ${onDark ? "on-dark" : ""} ${active ? "is-active" : ""}" data-filter="${esc(value)}" style="${style}" aria-pressed="${active}">
      ${value === "Alles" ? "" : `<span class="dot" style="background:${active ? text : colour}"></span>`}${esc(label)}</button>`;
  };
  return `<div class="chips">${chip("Alles", "Alles", "var(--brand)")}${DEPARTMENTS.map(d => chip(d.id, d.name, deptById(d.id).colour)).join("")}</div>`;
}

// One event as a list row (Soek, and the day list under the month view).
function eventRow(e){
  const day = toDate(e.date), dept = deptOf(e);
  const year = day.getFullYear() !== TODAY.getFullYear() ? ` ${day.getFullYear()}` : "";
  return `<div class="row-event" data-event="${e.id}" tabindex="0" role="button">
    <div style="width:40px;height:40px;border-radius:10px;background:${dept.wash};color:${dept.colour};display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;flex:none">
      ${esc(dept.name.charAt(0).toUpperCase())}
    </div>
    <div style="flex:1;min-width:0">
      <div style="font-size:14px;font-weight:600">${esc(e.title)}</div>
      <div style="font-size:12px;color:var(--muted)">${DAY_SHORT[(day.getDay() + 6) % 7]} ${day.getDate()} ${MONTHS[day.getMonth()].slice(0,3)}${year}, ${e.start}–${e.end} · ${esc(dept.name)}</div>
    </div>
  </div>`;
}

function calendarHeader(){
  const onToday = state.calView === "month"
    ? state.monthStart.getMonth() === TODAY.getMonth() && state.monthStart.getFullYear() === TODAY.getFullYear()
    : sameDay(state.weekStart, mondayOf(TODAY));
  const unit = state.calView === "month" ? "maand" : "week";
  const navBtn = (dir, label, ic) => `<button data-action="cal-${dir}" aria-label="${label} ${unit}"
    style="width:32px;height:32px;border-radius:16px;border:none;background:var(--surface-2);display:flex;align-items:center;justify-content:center">${icon(ic,16,"var(--brand)")}</button>`;
  return `<div style="padding:6px 16px 0">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;min-height:42px;padding-right:48px">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <button data-action="cal-today" class="mini-btn" ${onToday ? "disabled" : ""}>Vandag</button>
        <div role="group" aria-label="Kalender-aansig" style="display:inline-flex;background:var(--hairline);border-radius:16px;padding:3px">
          ${[["week","Week"],["month","Maand"]].map(([v, label]) => `<button data-action="cal-view-${v}" aria-pressed="${state.calView === v}"
            style="border:none;font-size:13px;padding:5px 14px;border-radius:13px;background:${state.calView === v ? "var(--surface)" : "transparent"};color:var(--shadow-ink)">${label}</button>`).join("")}
        </div>
      </div>
      <span style="display:flex;gap:2px;flex:none">
        <button data-tab="search" aria-label="Soek" style="background:none;border:none;padding:4px">${icon("search",20,"var(--brand)")}</button>
        ${roleOf() !== "user" ? `<button data-action="new-event" aria-label="Skep geleentheid" style="background:none;border:none;padding:4px">${icon("plus",20,"var(--brand)")}</button>` : ""}
      </span>
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin:4px 0 0;position:relative">
      <button class="cal-title" data-action="cal-jump" title="Spring na 'n datum">${calendarTitle()} ${icon("right",14,"var(--muted)")}</button>
      <input type="date" id="date-jump" value="${state.selectedDate}" min="2000-01-01" max="2100-12-31" tabindex="-1" aria-label="Spring na 'n datum">
      <div style="display:flex;gap:4px;flex:none">${navBtn("prev","Vorige","left")}${navBtn("next","Volgende","right")}</div>
    </div>
    <div style="margin-top:8px">${filterChips()}</div>
  </div>`;
}

function screenCalendar(){
  return calendarHeader() + (state.calView === "month" ? monthBody() : weekBody());
}

function weekBody(){
  const [H0, H1] = weekHours();
  const { rowHeightPx:RH } = CONFIG;
  const PX = hourWidth(H1 - H0);
  state.calHours = [H0, H1, PX];              // render() uses this to restore the scroll
  const gridWidth = (H1 - H0) * PX;
  const weekEnd = addDays(state.weekStart, 6);

  let html = `<div class="weekgrid" id="weekgrid"><div style="width:${gridWidth + 48}px;position:relative">`;

  // Hour ruler, pinned to the top while the user scrolls vertically.
  html += `<div class="weekrow" style="height:24px;position:sticky;top:0;z-index:3;background:var(--surface);border-bottom:.5px solid var(--hairline)">
             <div class="daylabel" style="z-index:4"></div>`;
  for (let h = H0; h < H1; h++){
    html += `<div style="width:${PX}px;flex:none;font-size:10px;color:var(--muted);padding:5px 0 0 3px;border-left:.5px solid var(--hairline)">${String(h).padStart(2,"0")}:00</div>`;
  }
  html += `</div>`;

  // One row per day.
  for (let i = 0; i < 7; i++){
    const day       = addDays(state.weekStart, i);
    const isToday   = sameDay(day, TODAY);
    const isWeekend = i > 4;

    html += `<div class="weekrow" style="height:${RH}px;border-bottom:.5px solid var(--hairline)">
      <div class="daylabel">
        <span style="font-size:10px;color:${isToday ? "var(--brand)" : "var(--muted)"}">${DAY_SHORT[i]}</span>
        <span style="width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:${isToday ? 700 : 500};${
          isToday ? "background:var(--brand);color:#fff" : isWeekend ? "color:var(--muted)" : ""
        }">${day.getDate()}</span>
      </div>
      <div style="position:relative;width:${gridWidth}px;flex:none;background:repeating-linear-gradient(90deg,transparent 0 ${PX-1}px,var(--hairline) ${PX-1}px ${PX}px)">`;

    eventsOn(day).forEach(e => {
      const cat   = deptOf(e);
      const left  = (hmToDecimal(e.start) - H0) * PX + 1;
      const width = Math.max(18, (hmToDecimal(e.end) - hmToDecimal(e.start)) * PX - 3);
      const tick  = state.supported.has(e.id) ? " " + icon("check",10,cat.ink) : "";
      html += `<button class="block" data-event="${e.id}" title="${esc(e.title)} ${e.start}–${e.end}"
        style="left:${left}px;width:${width}px;background:${cat.wash};color:${cat.ink};border-left:3px solid ${cat.colour}">
        <b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.title)}</b>${e.start}${tick}</button>`;
    });

    html += `</div></div>`;
  }

  // "Now" line — only drawn when today falls inside the visible week.
  if (TODAY >= state.weekStart && TODAY < addDays(weekEnd, 1)){
    const nowHours = TODAY.getHours() + TODAY.getMinutes() / 60;
    if (nowHours >= H0 && nowHours <= H1){
      const x = 48 + (nowHours - H0) * PX;
      const label = `${String(TODAY.getHours()).padStart(2,"0")}:${String(TODAY.getMinutes()).padStart(2,"0")}`;
      html += `<div style="position:absolute;left:${x}px;top:24px;bottom:0;width:1.5px;background:var(--brand);z-index:1;pointer-events:none"></div>
               <div style="position:absolute;left:${x-15}px;top:3px;z-index:4;background:var(--brand);color:#fff;font-size:10px;font-weight:600;padding:2px 5px;border-radius:8px">${label}</div>`;
    }
  }

  return html + `</div></div>`;
}

function monthBody(){
  const first = state.monthStart;
  const gridStart = mondayOf(first);
  const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  const offset = (first.getDay() + 6) % 7;
  const weeks = Math.ceil((offset + daysInMonth) / 7);

  let cells = DAY_SHORT.map((d, i) => `<div class="mg-head${i > 4 ? " weekend" : ""}">${d}</div>`).join("");
  for (let i = 0; i < weeks * 7; i++){
    const day = addDays(gridStart, i), iso = toISO(day), evs = eventsOn(day);
    const cls = ["mg-cell", day.getMonth() !== first.getMonth() && "other", i % 7 > 4 && "weekend",
                 sameDay(day, TODAY) && "today", iso === state.selectedDate && "selected"].filter(Boolean).join(" ");
    const count = evs.length === 1 ? ", 1 geleentheid" : evs.length ? `, ${evs.length} geleenthede` : "";
    cells += `<button class="${cls}" data-action="pick-day" data-date="${iso}" aria-label="${day.getDate()} ${MONTHS[day.getMonth()]}${count}" aria-pressed="${iso === state.selectedDate}">
      <span class="mg-num">${day.getDate()}</span>
      <span class="mg-events">${evs.slice(0, 3).map(e => {
        const d = deptOf(e);
        return `<span class="mg-pill" style="--c:${d.colour};--w:${d.wash};--i:${d.ink}">${esc(e.title)}</span>`;
      }).join("")}${evs.length > 3 ? `<span class="mg-more">+${evs.length - 3}</span>` : ""}</span>
    </button>`;
  }

  const sel = toDate(state.selectedDate);
  const dayEvents = eventsOn(sel);
  return `<div class="monthview" id="monthview">
    <div class="month-grid">${cells}</div>
    <div class="day-list">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <h3 style="margin:0;font-size:16px">${DAY_LONG[(sel.getDay() + 6) % 7]} ${sel.getDate()} ${MONTHS[sel.getMonth()]}${sameDay(sel, TODAY) ? " · vandag" : ""}</h3>
        <button class="btn-link" data-action="show-week" style="padding:4px 0;font-size:13px;flex:none">Wys week</button>
      </div>
      ${dayEvents.length ? dayEvents.map(eventRow).join("") : `<p style="font-size:14px;color:var(--muted);margin:8px 0">Niks beplan nie.</p>`}
    </div>
  </div>`;
}

/* --- 6b. Kaart + location --------------------------------------------------
   Real map (Leaflet + OpenStreetMap) with every event's pin. The selected
   event shows its check-in circle. The user's live position comes from the
   browser (needs HTTPS and the user's permission — we only ask after they tap
   "Deel my ligging"). "Meld aan" only works inside the circle, and a check-in
   lands in that event's Excel export.
   TODO: check-in currently works on any day; in production only allow it
   from shortly before the event starts until it ends.
------------------------------------------------------------------------- */
const geo = { status:"idle", pos:null, watchId:null, framed:false };
//            status: idle | asking | on | denied | unavailable

function startLocation(){
  if (!("geolocation" in navigator)){ geo.status = "unavailable"; onLocationUpdate(); return; }
  if (geo.watchId != null) return;
  geo.status = "asking"; onLocationUpdate();
  geo.watchId = navigator.geolocation.watchPosition(p => {
    geo.pos = { lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy) };
    geo.status = "on";
    onLocationUpdate();
  }, err => {
    geo.status = err.code === 1 ? "denied" : "unavailable";   // 1 = PERMISSION_DENIED
    stopWatching();
    onLocationUpdate();
  }, { enableHighAccuracy:true, maximumAge:10000, timeout:20000 });
}
function stopWatching(){
  if (geo.watchId != null) navigator.geolocation.clearWatch(geo.watchId);
  geo.watchId = null;
}
function stopLocation(){
  stopWatching();
  Object.assign(geo, { status:"idle", pos:null, framed:false });
}
function distanceM(a, b){                   // great-circle distance in metres
  const R = 6371000, rad = x => x * Math.PI / 180;
  const h = Math.sin(rad(b.lat - a.lat) / 2) ** 2
          + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(rad(b.lng - a.lng) / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function formatDistance(m){ return m < 1000 ? `${Math.round(m)} m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0).replace(".", ",")} km`; }

// Which event the Kaart card is about: the one picked, else the one on now,
// else the next one, else the most recent.
function mapEvent(){
  const picked = state.mapEventId != null && eventById(state.mapEventId);
  if (picked && !isForUser(picked)) state.mapEventId = null;
  if (picked && isForUser(picked)) return picked;
  const at = e => new Date(`${e.date}T${e.end}`);
  const sorted = visibleEvents().sort((a,b) => at(a) - at(b));
  return sorted.find(e => at(e) >= TODAY) || sorted[sorted.length - 1] || null;
}

function pinIcon(colour, big){
  const s = big ? 40 : 30;
  return L.divIcon({ className:"", iconSize:[s, s], iconAnchor:[s / 2, s - 2],
    html:`<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z" fill="${colour}" stroke="#fff" stroke-width="1.5"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></svg>` });
}
const OSM_TILES = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const OSM_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>';
function newMap(el, opts){
  const map = L.map(el, { zoomControl:false, ...opts });
  L.tileLayer(OSM_TILES, { maxZoom:19, attribution:OSM_ATTRIBUTION }).addTo(map);
  return map;
}
const MAP_UNAVAILABLE = `<div style="padding:40px 20px;text-align:center;color:#555;font-size:14px">Die kaart kon nie laai nie. Kyk of jy aan die internet gekoppel is.</div>`;

function mapSegmentedControl(){
  return `<div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;background:var(--hairline);border-radius:18px;padding:3px;z-index:3">
    ${["map","qr"].map(mode => `<button data-action="map-${mode}"
      style="border:none;font-size:13px;padding:6px 24px;border-radius:15px;background:${state.mapMode===mode ? "var(--surface)" : "transparent"};color:var(--shadow-ink)">${mode==="map" ? "Kaart" : "QR"}</button>`).join("")}
  </div>`;
}

function screenMap(){
  if (state.mapMode === "qr"){
    // A fresh render has no camera running, so don't claim we're scanning.
    if (["starting","scanning"].includes(state.scan.status)) state.scan = { status:"idle", message:"" };
    return `<div class="scanner">
      <video id="scan-video" playsinline muted></video>
      <div class="scan-frame"></div>
    </div>
    ${mapSegmentedControl()}
    <div class="bottom-bar map-card" id="scan-card">${scanCardHtml()}</div>`;
  }
  return `<div id="kaart-map" class="map" role="region" aria-label="Kaart met geleenthede"></div>
    ${mapSegmentedControl()}
    <button class="map-fab" style="top:58px" data-action="locate-me" aria-label="Wys my ligging">${icon("locate",20,"#4285f4")}</button>
    <div class="bottom-bar map-card" id="map-card">${mapCardHtml()}</div>`;
}

// The card at the bottom of Kaart. Re-rendered on its own whenever the
// location updates, so the map itself doesn't flicker.
function mapCardHtml(){
  const e = mapEvent();
  if (!e) return `<div style="font-size:14px;color:var(--muted)">Daar is nog geen geleenthede nie.</div>`;
  const loc = locationOf(e);
  const mine = checkinFor(e);
  const sorted = visibleEvents().sort((a,b) => a.date.localeCompare(b.date) || a.start.localeCompare(b.start));
  const d = toDate(e.date);

  let status = "", button = "";
  if (mine){
    status = `<span style="color:var(--brand)">${icon("check",14,"var(--brand)")} Jy is aangemeld om ${formatDateTime(mine.at).slice(11)}</span>`;
    button = `<button class="btn-checkin done" disabled>${icon("check",16,"var(--brand)")} Aangemeld</button>`;
  } else if (geo.status === "on" && geo.pos){
    const dist = distanceM(geo.pos, loc);
    const inside = dist <= loc.radius;
    status = inside
      ? `<span style="color:#1f8a3b">Jy is ${formatDistance(dist)} weg — binne die area</span>`
      : `Jy is ${formatDistance(dist)} weg — nog ${formatDistance(dist - loc.radius)} tot by die area`;
    status += ` <span style="color:var(--muted)">(±${geo.pos.accuracy} m)</span>`;
    button = `<button class="btn-checkin" data-action="checkin" ${inside ? "" : "disabled"}>${inside ? "Meld aan" : "Kom nader om aan te meld"}</button>`;
  } else if (geo.status === "asking"){
    status = "Wag vir jou ligging…";
    button = `<button class="btn-checkin" disabled>Meld aan</button>`;
  } else if (geo.status === "denied"){
    status = `<span style="color:var(--brand)">Ligging is geblokkeer.</span> Laat dit toe in jou blaaier se instellings en probeer weer.`;
    button = `<button class="btn-checkin" data-action="start-location">Probeer weer</button>`;
  } else if (geo.status === "unavailable"){
    status = "Kon nie jou ligging kry nie. Gaan buite of skakel ligging aan.";
    button = `<button class="btn-checkin" data-action="start-location">Probeer weer</button>`;
  } else {
    status = "Deel jou ligging sodat ons kan sien of jy daar is.";
    button = `<button class="btn-checkin" data-action="start-location">${icon("locate",16,"#fff")} Deel my ligging</button>`;
  }

  return `
    <div style="display:flex;align-items:center;gap:8px">
      <span class="dot" style="background:${deptOf(e).colour}"></span>
      <select id="map-event-select" aria-label="Kies geleentheid">
        ${sorted.map(x => `<option value="${x.id}" ${x.id === e.id ? "selected" : ""}>${esc(x.title)}</option>`).join("")}
      </select>
    </div>
    <div style="font-size:12px;color:var(--muted);margin:2px 0 8px 16px">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)} · ${e.start} · ${esc(e.venue || loc.address)}</div>
    <div style="font-size:13px;margin-bottom:10px;line-height:1.4">${status}</div>
    ${button}`;
}

// Live Leaflet objects for the Kaart tab. Rebuilt on every full render.
const kaart = { map:null, me:null, meCircle:null, area:null };

function mountKaartMap(el){
  if (!window.L){ el.innerHTML = MAP_UNAVAILABLE; return; }
  const selected = mapEvent();
  const focus = selected ? locationOf(selected) : CONFIG.schoolLocation;
  kaart.map = newMap(el, {}).setView([focus.lat, focus.lng], 16);

  // One pin per event; the selected one is bigger, on top, and has its circle.
  visibleEvents().forEach(e => {
    const loc = locationOf(e), isSel = selected && e.id === selected.id;
    L.marker([loc.lat, loc.lng], { icon:pinIcon(deptOf(e).colour, isSel), zIndexOffset:isSel ? 1000 : 0, title:e.title })
      .addTo(kaart.map)
      .on("click", () => { state.mapEventId = e.id; render(); });
  });
  if (selected){
    const loc = locationOf(selected);
    kaart.area = L.circle([loc.lat, loc.lng], { radius:loc.radius, color:deptOf(selected).colour, weight:2, dashArray:"5 4", fillOpacity:.1 }).addTo(kaart.map);
  }
  updateMeOnMap();
}

function updateMeOnMap(){
  if (!kaart.map) return;
  if (!(geo.status === "on" && geo.pos)){
    if (kaart.me){ kaart.me.remove(); kaart.meCircle.remove(); kaart.me = kaart.meCircle = null; }
    return;
  }
  const ll = [geo.pos.lat, geo.pos.lng];
  if (!kaart.me){
    kaart.meCircle = L.circle(ll, { radius:geo.pos.accuracy, color:"#4285f4", weight:1, fillOpacity:.12 }).addTo(kaart.map);
    kaart.me = L.marker(ll, { icon:L.divIcon({ className:"", html:'<div class="me-dot"></div>', iconSize:[16,16], iconAnchor:[8,8] }), zIndexOffset:2000, interactive:false }).addTo(kaart.map);
  } else {
    kaart.me.setLatLng(ll); kaart.meCircle.setLatLng(ll).setRadius(geo.pos.accuracy);
  }
  // First fix: show both you and the event, if you're anywhere nearby.
  if (!geo.framed && kaart.area){
    geo.framed = true;
    const bounds = kaart.area.getBounds().extend(ll);
    if (distanceM(geo.pos, kaart.area.getLatLng()) < 30000) kaart.map.fitBounds(bounds, { padding:[40, 40], maxZoom:17 });
  }
}

// Tear down Leaflet maps before their DOM is replaced by render().
function unmountMaps(){
  if (kaart.map){ kaart.map.remove(); Object.assign(kaart, { map:null, me:null, meCircle:null, area:null }); }
  if (picker.map){ picker.map.remove(); Object.assign(picker, { map:null, pin:null, circle:null }); }
}
function mountMaps(){
  const k = document.getElementById("kaart-map");
  if (k) mountKaartMap(k);
  const p = document.getElementById("pick-map");
  if (p) mountPickerMap(p);
}

function onLocationUpdate(){
  const card = document.getElementById("map-card");
  if (card) card.innerHTML = mapCardHtml();
  updateMeOnMap();
}

// "Meld aan" on the Kaart card. Goes through the same outbox as QR scans, so
// it also works without internet; the server re-checks the distance.
async function checkIn(){
  const e = mapEvent();
  if (!e || !state.user || !isForUser(e) || !(geo.status === "on" && geo.pos) || checkinFor(e)) return;
  const loc = locationOf(e);
  if (distanceM(geo.pos, loc) > loc.radius) return;
  await queueCheckin({ eventId:e.id, method:"gps", token:null, pos:{ ...geo.pos } });
  onLocationUpdate();
}

/* --- Location picker (Skep form) -------------------------------------------
   Admins set an event's pin by searching an address, tapping/dragging on the
   map, or "Gebruik my ligging", then choose the radius with the slider.
   Address search: OpenStreetMap Nominatim (free; max ~1 search per second —
   fine for admins, but TODO: use a paid geocoder or our own proxy if usage grows).
------------------------------------------------------------------------- */
const picker = { map:null, pin:null, circle:null };

function mountPickerMap(el){
  if (!window.L){ el.innerHTML = MAP_UNAVAILABLE; return; }
  const form = el.closest("form");
  const lat = Number(form.lat.value), lng = Number(form.lng.value), radius = Number(form.radius.value);
  picker.map = newMap(el, { zoomControl:true }).setView([lat, lng], 16);
  picker.circle = L.circle([lat, lng], { radius, color:"#C0262D", weight:2, dashArray:"5 4", fillOpacity:.1 }).addTo(picker.map);
  picker.pin = L.marker([lat, lng], { draggable:true, icon:pinIcon("#C0262D", true), autoPan:true }).addTo(picker.map);
  picker.pin.on("drag", ev => picker.circle.setLatLng(ev.target.getLatLng()));
  picker.pin.on("dragend", ev => setPickerPoint(ev.target.getLatLng()));
  picker.map.on("click", ev => setPickerPoint(ev.latlng));
  fitPickerCircle();
}

// Zoom so the whole check-in circle is visible.
function fitPickerCircle(){
  if (picker.map) picker.map.fitBounds(picker.circle.getBounds(), { padding:[24, 24], maxZoom:18, animate:false });
}

function setPickerPoint(ll, address, zoom){
  const form = document.querySelector('[data-form="event"]');
  if (!form || !picker.map) return;
  form.lat.value = Number(ll.lat).toFixed(7); form.lng.value = Number(ll.lng).toFixed(7);
  if (address != null) form.address.value = address;
  picker.pin.setLatLng(ll); picker.circle.setLatLng(ll);
  if (zoom) fitPickerCircle(); else picker.map.panTo(ll);
}

function setPickerRadius(radius){
  const label = document.getElementById("radius-label");
  if (label) label.textContent = `${radius} m`;
  if (picker.circle){ picker.circle.setRadius(Number(radius)); fitPickerCircle(); }
}

async function geocodeAddress(){
  const form = document.querySelector('[data-form="event"]');
  const out = document.getElementById("geo-results");
  const q = form.address.value.trim();
  if (!q){ toast("Tik eers 'n adres in"); return; }
  out.innerHTML = `<div style="font-size:13px;color:var(--muted);margin-top:6px">Soek…</div>`;
  try {
    const url = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&countrycodes=za&accept-language=af,en&q=${encodeURIComponent(q)}`;
    const results = await (await fetch(url, { headers:{ "Accept":"application/json" } })).json();
    out.innerHTML = results.length
      ? results.map(r => `<button type="button" data-action="pick-geocode" data-lat="${esc(r.lat)}" data-lng="${esc(r.lon)}" data-label="${esc(r.display_name)}">${esc(r.display_name)}</button>`).join("")
      : `<div style="font-size:13px;color:var(--muted);margin-top:6px">Niks gevind nie. Probeer 'n straatnaam en voorstad, of sleep die pen.</div>`;
  } catch {
    out.innerHTML = `<div style="font-size:13px;color:var(--brand);margin-top:6px">Kon nie soek nie. Kyk jou internet, of sleep die pen.</div>`;
  }
}

function useMyLocationForPin(){
  if (!("geolocation" in navigator)){ toast("Jou toestel deel nie ligging nie"); return; }
  toast("Kry jou ligging…");
  navigator.geolocation.getCurrentPosition(
    p => setPickerPoint({ lat:p.coords.latitude, lng:p.coords.longitude }, null, 17),
    () => toast("Kon nie jou ligging kry nie"),
    { enableHighAccuracy:true, timeout:15000 });
}

/* --- 6b2. QR check-in -------------------------------------------------------
   HOW IT WORKS
   An admin shows a QR code for their event (Skep list, or the event screen):
     • Lewendig (recommended): on a phone/tablet at the entrance. It changes
       every 30 s, so a photo forwarded to a friend goes stale within a minute.
     • Om te druk: a fixed code for a poster. Only the location check protects it.
   The codes are signed by the SERVER (qr_tokens() in the database) with a
   secret that never leaves it. The app fetches the next 10 minutes of live
   codes at a time, so a short network drop doesn't blank the entrance screen.
   The QR is a link:  <app url>#aanmeld=<eventId>.<window | p>.<signature>
   Scanning it (phone camera app, or Kaart ▸ QR) saves the scan in an OUTBOX
   on the phone with the time, the GPS position (GPS works without internet)
   and a device id, and sends it as soon as the phone is online.
   The database function checkin() re-checks everything and files it as a
   normal check-in or — with the reason — under "Verdagte aanmeldings":
     • the live code was more than a minute old (forwarded)
     • no location, or outside the event's circle
     • the same phone checked in someone else for this event (in the export)
   Invalid codes are rejected. Nothing else is rejected automatically.
------------------------------------------------------------------------- */
const QR_WINDOW_MS = 30000;        // the live code changes every 30 s
const METHOD_LABELS = { gps:"GPS", "qr-live":"QR", "qr-print":"QR (plakkaat)" };

function b64url(bytes){
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function currentWindow(t = Date.now()){ return Math.floor(t / QR_WINDOW_MS); }
function qrLink(token){ return `${location.origin}${location.pathname}#aanmeld=${token}`; }
function parseQrText(text){
  const m = String(text).trim().match(/(?:aanmeld=)?(\d+)\.(p|\d+)\.([A-Za-z0-9_-]{8,})$/);
  return m ? { eventId:Number(m[1]), token:`${m[1]}.${m[2]}.${m[3]}`, print: m[2] === "p" } : null;
}
function deviceId(){               // random, per browser; used to spot one phone checking in several people
  let id = null;
  try { id = localStorage.getItem("garsie.device"); } catch {}
  if (!id){
    id = crypto.randomUUID ? crypto.randomUUID() : b64url(crypto.getRandomValues(new Uint8Array(16)));
    try { localStorage.setItem("garsie.device", id); } catch {}
  }
  return id;
}

/* --- Admin: show the QR ------------------------------------------------- */
let qrTimer = null, qrDrawn = null, wakeLock = null;
const qrCache = { key:null, tokens:new Map(), loading:false, error:null, lastTry:0 };

function screenQr(){
  const e = eventById(state.qrEventId);
  const d = toDate(e.date);
  const live = state.qrMode === "live";
  return `<div class="panel"><div class="content" style="text-align:center">
    <div class="no-print" style="text-align:left">
      <button data-action="close-qr" aria-label="Terug" style="width:36px;height:36px;border-radius:18px;background:var(--surface-2);border:none;display:flex;align-items:center;justify-content:center">${icon("left",20,"var(--brand)")}</button>
    </div>
    <div class="qr-printable">
      <h1 style="font-size:24px;margin:10px 0 4px">${esc(e.title)}</h1>
      <div style="color:var(--muted);font-size:14px">${d.getDate()} ${MONTHS[d.getMonth()]} · ${e.start} · ${esc(e.venue || locationOf(e).address)}</div>
      <div id="qr-box" class="qr-box"><p style="color:#666">Laai kode…</p></div>
      <div class="qr-print-hint">Skandeer met jou foon se kamera om aan te meld</div>
    </div>
    <div class="no-print">
      ${live ? `<div class="qr-timer" aria-hidden="true"><div id="qr-bar"></div></div>` : ""}
      <div style="display:inline-flex;background:var(--hairline);border-radius:18px;padding:3px;margin:14px 0 10px">
        ${[["live","Lewendig"],["print","Om te druk"]].map(([m, label]) => `<button data-action="qr-mode-${m}"
          style="border:none;font-size:13px;padding:6px 18px;border-radius:15px;background:${state.qrMode===m ? "var(--surface)" : "transparent"};color:var(--shadow-ink)">${label}</button>`).join("")}
      </div>
      <p style="font-size:13px;color:var(--muted);max-width:420px;margin:0 auto 12px;line-height:1.45">${live
        ? "Die kode verander elke 30 sekondes. Wys dit by die ingang: 'n foto wat vir 'n vriend aangestuur word, werk binne 'n minuut nie meer nie."
        : "Hierdie kode verander nooit nie, so net die ligging-toets beskerm dit. Gebruik liewer die lewendige kode as daar 'n foon of tablet by die ingang kan staan."}</p>
      ${live ? "" : `<button class="btn-primary" data-action="print-qr" style="max-width:320px">Druk plakkaat</button>`}
    </div>
  </div></div>`;
}

function cachedQrToken(e, mode){
  if (qrCache.key !== `${e.id}:${mode}`) return null;
  return qrCache.tokens.get(mode === "print" ? "p" : String(currentWindow())) || null;
}
async function fetchQrTokens(e, mode){
  qrCache.loading = true; qrCache.lastTry = Date.now();
  try {
    const { data, error } = await sb.rpc("qr_tokens", { p_event_id:e.id, p_mode:mode });
    if (error) throw error;
    qrCache.key = `${e.id}:${mode}`;
    qrCache.tokens = new Map(data.map(r => [r.win == null ? "p" : String(r.win), r.token]));
    qrCache.error = null;
  } catch (err){
    qrCache.error = dbMessage(err);
  } finally { qrCache.loading = false; }
}
async function drawQr(){
  const box = document.getElementById("qr-box");
  const e = state.qrEventId != null && eventById(state.qrEventId);
  if (!box || !e) return;
  if (!window.qrcode){ box.innerHTML = `<p style="color:#c5221f">Die QR-kode kon nie laai nie. Kyk jou internet.</p>`; return; }
  const mode = state.qrMode;
  // Top up the live codes when fewer than 2 minutes are left (and not more than every 5 s).
  const w = currentWindow();
  const lowOnCodes = mode === "live" && !qrCache.tokens.has(String(w + 4));
  if ((!cachedQrToken(e, mode) || (qrCache.key === `${e.id}:${mode}` && lowOnCodes)) && !qrCache.loading && Date.now() - qrCache.lastTry > 5000){
    await fetchQrTokens(e, mode);
  }
  const token = cachedQrToken(e, mode);
  if (document.getElementById("qr-box") !== box) return;
  if (!token){
    box.innerHTML = `<p style="color:#c5221f;padding:12px">${esc(qrCache.error || "Laai kode…")}</p>`;
    qrDrawn = null;                           // try again on the next tick
    return;
  }
  const q = qrcode(0, "M");
  q.addData(qrLink(token));
  q.make();
  box.innerHTML = q.createSvgTag({ cellSize:6, margin:3, scalable:true });
}
function startQrTicker(){
  stopQrTicker();
  const tick = () => {
    const w = state.qrMode === "print" ? "p" : currentWindow();
    if (w !== qrDrawn){ qrDrawn = w; drawQr(); }
    const bar = document.getElementById("qr-bar");
    if (bar) bar.style.width = `${100 - (Date.now() % QR_WINDOW_MS) / QR_WINDOW_MS * 100}%`;
  };
  tick();
  qrTimer = setInterval(tick, 250);
  // Keep the entrance screen from going to sleep while the live code shows.
  if (state.qrMode === "live" && navigator.wakeLock) navigator.wakeLock.request("screen").then(l => { wakeLock = l; }).catch(() => {});
}
function stopQrTicker(){
  clearInterval(qrTimer); qrTimer = null; qrDrawn = null;
  if (wakeLock){ wakeLock.release().catch(() => {}); wakeLock = null; }
}

/* --- Supporter: scan ------------------------------------------------------- */
// Check-ins waiting to be sent: [{ uid, eventId, method, token, scannedAt, pos, device }]
let OUTBOX = (v => Array.isArray(v) ? v.filter(o => o && typeof o.eventId === "number" && typeof o.uid === "string") : [])(loadJSON("garsie.outbox"));
function saveOutbox(){ saveJSON("garsie.outbox", OUTBOX); }
function myOutbox(){ return OUTBOX.filter(o => state.user && o.uid === state.user.id); }

function setScan(status, message){
  state.scan = { status, message };
  const card = document.getElementById("scan-card");
  if (card) card.innerHTML = scanCardHtml();
  else if (message && !["starting","scanning","busy"].includes(status)) toast(message);
}

function scanCardHtml(){
  const { status, message } = state.scan;
  const waiting = myOutbox().length;
  const colours = { ok:"#1f8a3b", flagged:"#b26a00", error:"var(--brand)", queued:"var(--shadow-ink)" };
  let body, button;
  if (status === "scanning" || status === "starting"){
    body = message || "Rig die kamera op die QR-kode";
    button = `<button class="btn-checkin done" data-action="stop-scan">Stop</button>`;
  } else if (status === "busy"){
    body = message; button = `<button class="btn-checkin" disabled>Besig…</button>`;
  } else if (status === "idle"){
    body = "Skandeer die QR-kode by die ingang om aan te meld.";
    button = `<button class="btn-checkin" data-action="start-scan">${icon("qr",16,"#fff")} Begin skandeer</button>`;
  } else {
    body = `<span style="color:${colours[status] || "inherit"}">${status === "ok" ? icon("check",14,"#1f8a3b") + " " : ""}${esc(message)}</span>`;
    button = `<button class="btn-checkin" data-action="start-scan">Skandeer nog een</button>`;
  }
  return `<div style="font-size:14px;margin-bottom:10px;line-height:1.4">${body}</div>
    ${!navigator.onLine ? `<div style="font-size:12px;color:var(--muted);margin:-4px 0 10px">Geen internet nie — skanderings word op jou foon gestoor en later gestuur.</div>` : ""}
    ${waiting ? `<div style="font-size:12px;color:#b26a00;margin:-4px 0 10px">${waiting} aanmelding${waiting > 1 ? "s" : ""} wag om gestuur te word.</div>` : ""}
    ${button}`;
}

const scanner = { stream:null, timer:null, detector:null, canvas:null };

async function startScanner(){
  if (!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia)){
    setScan("error", "Hierdie blaaier kan nie die kamera gebruik nie. Skandeer die kode met jou foon se kamera-app."); return;
  }
  setScan("starting", "Maak die kamera oop…");
  try {
    scanner.stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" }, audio:false });
  } catch {
    setScan("error", "Kon nie die kamera oopmaak nie. Laat kamera-toegang toe, of skandeer met jou foon se kamera-app."); return;
  }
  const video = document.getElementById("scan-video");
  if (!video){ stopScanner(); return; }
  video.srcObject = scanner.stream;
  await video.play().catch(() => {});
  if (!scanner.detector && "BarcodeDetector" in window){
    try { scanner.detector = new BarcodeDetector({ formats:["qr_code"] }); } catch {}
  }
  setScan("scanning", "Rig die kamera op die QR-kode");
  scanTick();
}
async function scanTick(){
  const video = document.getElementById("scan-video");
  if (!scanner.stream || !video) return;
  let text = null;
  try {
    if (video.readyState >= 2){
      if (scanner.detector){                         // built into Android Chrome
        const codes = await scanner.detector.detect(video);
        if (codes[0]) text = codes[0].rawValue;
      } else if (window.jsQR){                       // fallback, e.g. iPhone Safari
        const c = scanner.canvas || (scanner.canvas = document.createElement("canvas"));
        const scale = Math.min(1, 640 / Math.max(video.videoWidth, video.videoHeight));
        c.width = Math.round(video.videoWidth * scale); c.height = Math.round(video.videoHeight * scale);
        const ctx = c.getContext("2d", { willReadFrequently:true });
        ctx.drawImage(video, 0, 0, c.width, c.height);
        const hit = jsQR(ctx.getImageData(0, 0, c.width, c.height).data, c.width, c.height, { inversionAttempts:"dontInvert" });
        if (hit) text = hit.data;
      }
    }
  } catch {}
  if (text){ stopScanner(); handleScan(text); return; }
  scanner.timer = setTimeout(scanTick, 150);
}
function stopScanner(){
  clearTimeout(scanner.timer); scanner.timer = null;
  if (scanner.stream) scanner.stream.getTracks().forEach(t => t.stop());
  scanner.stream = null;
}

function currentPosition(){                     // GPS works offline; null if refused or no fix
  return new Promise(resolve => {
    if (!("geolocation" in navigator)) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat:p.coords.latitude, lng:p.coords.longitude, accuracy:Math.round(p.coords.accuracy) }),
      () => resolve(null),
      { enableHighAccuracy:true, timeout:15000, maximumAge:30000 });
  });
}

async function handleScan(text){
  const scan = parseQrText(text);
  if (!scan){ setScan("error", "Dit is nie 'n Garsie Army-aanmeldkode nie."); return; }
  if (!state.user){
    try { sessionStorage.setItem("garsie.pendingScan", scan.token); } catch {}
    toast("Teken eers in — dan meld ons jou aan"); return;
  }
  const e = eventById(scan.eventId);
  if (e && !isForUser(e)){ setScan("error", "Hierdie geleentheid is nie vir jou nie."); return; }
  if (e && checkinFor(e)){ setScan("ok", "Jy is reeds aangemeld."); return; }
  setScan("busy", "Kry jou ligging…");
  const pos = await currentPosition();
  await queueCheckin({ eventId:scan.eventId, method: scan.print ? "qr-print" : "qr-live", token:scan.token, pos });
}

// Save a check-in in the outbox, then try to send it straight away.
async function queueCheckin({ eventId, method, token, pos }){
  if (myOutbox().some(o => o.eventId === eventId)){
    setScan("queued", "Reeds gestoor — dit word gestuur sodra jy internet het."); return;
  }
  OUTBOX = [...OUTBOX, { uid:state.user.id, eventId, method, token, scannedAt:new Date().toISOString(), pos, device:deviceId() }];
  saveOutbox();
  const { sent } = await syncOutbox();
  const mine = sent.find(x => x.item.eventId === eventId && x.item.uid === state.user.id);
  if (mine) setScan(mine.outcome.status, mine.outcome.message);
  else if (navigator.onLine && lastSyncError) setScan("queued", `Gestoor, maar kon nie nou stuur nie (${lastSyncError}). Ons probeer later weer.`);
  else setScan("queued", "Gestoor! Jy word aangemeld sodra jy weer internet het.");
}

// Send waiting check-ins to the database. Stops at the first network error
// (still offline) and keeps the rest for later.
let syncing = false, lastSyncError = "";
async function syncOutbox(){
  if (syncing || !sb || !state.user || !navigator.onLine || !myOutbox().length) return { sent:[] };
  syncing = true; lastSyncError = "";
  const sent = [];
  try {
    for (const item of myOutbox()){
      const { data, error } = await sb.rpc("checkin", {
        p_event_id:item.eventId, p_method:item.method, p_token:item.token, p_scanned_at:item.scannedAt,
        p_lat:item.pos ? item.pos.lat : null, p_lng:item.pos ? item.pos.lng : null,
        p_accuracy:item.pos ? item.pos.accuracy : null, p_device:item.device });
      // Any error from the call itself (offline, session expired, server busy)
      // says nothing about the check-in: keep it and try again later. Only a
      // real answer from checkin() (ok / flagged / error) takes it off the list.
      if (error){ lastSyncError = dbMessage(error); break; }
      const outcome = data;
      OUTBOX = OUTBOX.filter(o => o !== item);
      saveOutbox();
      sent.push({ item, outcome });
    }
  } finally { syncing = false; }
  if (sent.length) await refreshMyCheckins();
  return { sent };
}

// A QR opened with the phone's camera app arrives as #aanmeld=... in the URL.
function takeScanFromUrl(){
  const m = location.hash.match(/aanmeld=([^&]+)/);
  if (!m) return;
  try { sessionStorage.setItem("garsie.pendingScan", decodeURIComponent(m[1])); } catch {}
  history.replaceState(null, "", location.pathname + location.search);
}
function pendingScan(){ try { return sessionStorage.getItem("garsie.pendingScan"); } catch { return null; } }
function processPendingScan(){
  const token = pendingScan();
  if (!token || !state.user) return;
  try { sessionStorage.removeItem("garsie.pendingScan"); } catch {}
  if (roleOf() === "user"){ state.tab = "map"; state.mapMode = "qr"; state.openEventId = null; state.qrEventId = null; render(); }
  handleScan(token);
}

    </div>

    <div id="results">${searchResults()}</div>

function searchResults(){
  const q = cleanText(state.query, LIMITS.search).toLowerCase();
  const matches = visibleEvents()
    .filter(passesFilter)
    .filter(e => !q || e.title.toLowerCase().includes(q)
                    || deptOf(e).name.toLowerCase().includes(q)
                    || (e.venue || "").toLowerCase().includes(q));
  if (!matches.length){
    return `<p style="font-size:14px;color:var(--muted)">${q ? "Geen resultate nie. Probeer 'n ander woord." : "Daar is nog geen geleenthede nie."}</p>`;
  }
  // Coming up first (soonest on top), then what's already happened (latest on top).
  const today = toISO(TODAY);
  const key = e => `${e.date} ${e.start}`;
  const upcoming = matches.filter(e => e.date >= today).sort((a,b) => key(a).localeCompare(key(b)));
  const past     = matches.filter(e => e.date <  today).sort((a,b) => key(b).localeCompare(key(a)));
  const LIMIT = 30;   // TODO: paginate once there are hundreds
  return upcoming.slice(0, LIMIT).map(eventRow).join("")
    + (past.length ? `<h3 style="font-size:13px;color:var(--muted);font-weight:600;margin:16px 0 0">Verby</h3>${past.slice(0, 10).map(eventRow).join("")}` : "");
}

          </div>
          <button class="mini-btn" data-action="edit-event" data-id="${ev.id}" aria-label="Wysig">${icon("edit",14)}</button>
          <button class="mini-btn" data-action="show-qr" data-id="${ev.id}" aria-label="Wys QR-kode">${icon("qr",14)}</button>
          <button class="mini-btn" data-action="export" data-id="${ev.id}" aria-label="Laai Excel af">${icon("download",14)} Excel</button>
          <button class="mini-btn danger" data-action="delete-event" data-id="${ev.id}" aria-label="Skrap">${icon("trash",14)}</button>
        </div>`;
      }).join("") : `<p style="font-size:14px;color:var(--muted)">Nog geen geleenthede nie.</p>`}
    </div>
  </div></div>`;
}
